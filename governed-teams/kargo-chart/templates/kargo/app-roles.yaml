---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: app-developer
  namespace: {{ .Values.application.name }}
  annotations:
    kargo.akuity.io/description: Promote to dev and the team's own side stages.
    rbac.kargo.akuity.io/claims: '{"groups":["{{.Values.team.role}}-team"]}'
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: app-developer
  namespace: {{ .Values.application.name }}
rules:
- apiGroups:
  - kargo.akuity.io
  resources:
  - promotions
  verbs:
  - create
  - patch
  - update
- apiGroups:
  - kargo.akuity.io
  resources:
  - projects
  verbs:
  - list
  - get
- apiGroups:
  - kargo.akuity.io
  resources:
  - stages
  verbs:
  - promote
  # Developers promote to dev and to their own side stages. Never staging or prod.
  resourceNames:
  - dev
  {{- range .Values.pipeline.extraStages }}
  - {{ .name }}
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: app-developer
  namespace: {{ .Values.application.name }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: app-developer
subjects:
- kind: ServiceAccount
  name: app-developer
  namespace: {{ .Values.application.name }}
---
# This RoleBinding allows the app-developer ServiceAccount to view project
# resources (without redefining read rules), by binding it to the
# built-in kargo-viewer Role.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: app-developer-viewer
  namespace: {{ .Values.application.name }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: kargo-viewer
subjects:
- kind: ServiceAccount
  name: app-developer
  namespace: {{ .Values.application.name }}