# REJECTED (shared-secrets): a tenant step reads the platform's GitHub token.
image:
  repository: ghcr.io/akuity/sedemo-monorepo-rollouts-app
ingress:
  custom_prefix: rejected-gov
labels:
  purpose: demo
pipeline:
  dev:
    extraSteps:
    - uses: http
      config:
        method: GET
        url: https://api.github.com/repos/akuity/sedemo-monorepo
        headers:
        - name: Authorization
          value: "Bearer ${{ sharedSecret('github-pr-token').token }}"
