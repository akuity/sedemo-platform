<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" width="1200" height="660" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Shipping a change, from a team's point of view</title>
  <desc>A timeline in five steps. 1: the team edits its settings file and pushes. 2: the platform checks it automatically; a rejected file shows the reason in Argo CD and the team fixes it. 3: the team promotes through dev, its own stages and staging. 4: prod runs the same checklist for every team: a release lead starts it, checks run, an approver from outside the team approves, and it's recorded; failed checks block it, and emergencies go through break glass. 5: the release is live with a full record for audit.</desc>
  <style>
    :root {
      --bg: #ffffff; --text: #1f2328; --muted: #59636e; --line: #6e7781;
      --t-fill: #ddf4ff; --t-stroke: #54aeff;
      --p-fill: #f3eefe; --p-stroke: #8b6fd6;
      --g-fill: #dafbe1; --g-stroke: #4ac26b; --g-text: #1a7f37;
      --x-fill: #ffebe9; --x-stroke: #ff8182;
      --a-fill: #fff4d6; --a-stroke: #d4a72c;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0d1117; --text: #e6edf3; --muted: #9198a1; --line: #9198a1;
        --t-fill: #0c2d4b; --t-stroke: #388bfd;
        --p-fill: #241a3d; --p-stroke: #a371f7;
        --g-fill: #0f2d1a; --g-stroke: #3fb950; --g-text: #3fb950;
        --x-fill: #3d1214; --x-stroke: #f85149;
        --a-fill: #3b2e05; --a-stroke: #d29922;
      }
    }
    .bg { fill: var(--bg); }
    .t { fill: var(--t-fill); stroke: var(--t-stroke); stroke-width: 1.5; }
    .p { fill: var(--p-fill); stroke: var(--p-stroke); stroke-width: 1.5; }
    .g { fill: var(--g-fill); stroke: var(--g-stroke); stroke-width: 1.5; }
    .x { fill: var(--x-fill); stroke: var(--x-stroke); stroke-width: 1.5; }
    .a { fill: var(--a-fill); stroke: var(--a-stroke); stroke-width: 1.5; }
    .title { fill: var(--text); font-size: 22px; font-weight: 700; }
    .sub { fill: var(--muted); font-size: 14px; }
    .band { fill: var(--muted); font-size: 13px; font-weight: 600; letter-spacing: 0.02em; }
    .tag { font-size: 10.5px; font-weight: 700; letter-spacing: 0.08em; }
    .tag-t { fill: var(--t-stroke); } .tag-p { fill: var(--p-stroke); } .tag-g { fill: var(--g-text); }
    .h { fill: var(--text); font-size: 15px; font-weight: 600; }
    .b { fill: var(--text); font-size: 13px; font-weight: 600; }
    .s { fill: var(--muted); font-size: 12.5px; }
    .m { fill: var(--text); font-size: 12px; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .num { fill: var(--text); font-size: 15px; font-weight: 700; }
    .k { fill: var(--p-stroke); font-size: 13px; font-weight: 700; }
    .chip { fill: var(--text); font-size: 12px; font-weight: 600; }
    .ok { fill: var(--g-text); font-size: 12px; font-weight: 600; }
    .lbl { fill: var(--muted); font-size: 11.5px; font-style: italic; }
    .track { stroke: var(--line); stroke-width: 2; fill: none; marker-end: url(#ah); }
    .stem { stroke: var(--line); stroke-width: 1.5; }
    .bracket-t { stroke: var(--t-stroke); stroke-width: 2; fill: none; }
    .bracket-p { stroke: var(--p-stroke); stroke-width: 2; fill: none; }
    .arrow { stroke: var(--line); stroke-width: 1.5; fill: none; marker-end: url(#ah); }
    .back { stroke: var(--x-stroke); stroke-width: 1.5; fill: none; stroke-dasharray: 5 4; marker-end: url(#ahx); }
    .ahf { fill: var(--line); } .ahfx { fill: var(--x-stroke); }
  </style>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ahf"/></marker>
    <marker id="ahx" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ahfx"/></marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1200" height="660"/>

  <text class="title" x="25" y="36">Shipping a change, from a team's point of view</text>
  <text class="sub" x="25" y="60">Everything before prod is the team's. Prod runs the same checklist for every team.</text>

  <!-- Phase brackets -->
  <text class="band" x="370" y="92" text-anchor="middle">BEFORE PROD: YOUR PIPELINE</text>
  <path class="bracket-t" d="M25,108 V100 H715 V108"/>
  <text class="band" x="950" y="92" text-anchor="middle">PROD: SAME FOR EVERY TEAM</text>
  <path class="bracket-p" d="M725,108 V100 H1175 V108"/>

  <!-- Track -->
  <path class="track" d="M25,140 H1188"/>
  <text class="ok" x="470" y="130" text-anchor="middle">✓ accepted</text>

  <!-- Nodes and stems -->
  <line class="stem" x1="130" y1="157" x2="130" y2="180"/>
  <circle class="t" cx="130" cy="140" r="17"/><text class="num" x="130" y="145" text-anchor="middle">1</text>
  <line class="stem" x1="350" y1="157" x2="350" y2="180"/>
  <circle class="p" cx="350" cy="140" r="17"/><text class="num" x="350" y="145" text-anchor="middle">2</text>
  <line class="stem" x1="590" y1="157" x2="590" y2="180"/>
  <circle class="t" cx="590" cy="140" r="17"/><text class="num" x="590" y="145" text-anchor="middle">3</text>
  <line class="stem" x1="850" y1="157" x2="850" y2="180"/>
  <circle class="p" cx="850" cy="140" r="17"/><text class="num" x="850" y="145" text-anchor="middle">4</text>
  <line class="stem" x1="1080" y1="157" x2="1080" y2="180"/>
  <circle class="g" cx="1080" cy="140" r="17"/><text class="num" x="1080" y="145" text-anchor="middle">5</text>

  <!-- 1. Edit -->
  <rect class="t" x="25" y="180" width="210" height="140" rx="8"/>
  <text class="tag tag-t" x="41" y="202">YOUR TEAM</text>
  <text class="h" x="41" y="224">Edit and push</text>
  <text class="m" x="41" y="247">app-values.yaml</text>
  <text class="s" x="41" y="270">Image, labels, extra checks,</text>
  <text class="s" x="41" y="288">your own stages like qa or</text>
  <text class="s" x="41" y="306">smoke-test. Then push.</text>

  <!-- 2. Checked -->
  <rect class="p" x="250" y="180" width="200" height="110" rx="8"/>
  <text class="tag tag-p" x="266" y="202">AUTOMATIC</text>
  <text class="h" x="266" y="224">File is checked</text>
  <text class="s" x="266" y="248">Guardrails reject anything</text>
  <text class="s" x="266" y="266">that would weaken prod.</text>

  <line class="stem" x1="350" y1="290" x2="350" y2="308"/>
  <rect class="x" x="250" y="308" width="200" height="104" rx="8"/>
  <text class="b" x="266" y="331">✗ If rejected</text>
  <text class="s" x="266" y="352">Argo CD shows why:</text>
  <text class="m" x="266" y="371">GUARDRAIL [rule]</text>
  <text class="s" x="266" y="393">Old pipeline keeps running.</text>

  <path class="back" d="M250,360 H130 V322"/>
  <text class="lbl" x="138" y="380">fix and push again</text>

  <!-- 3. Promote -->
  <rect class="t" x="465" y="180" width="250" height="150" rx="8"/>
  <text class="tag tag-t" x="481" y="202">YOUR TEAM</text>
  <text class="h" x="481" y="224">Promote before prod</text>
  <rect class="t" x="481" y="238" width="48" height="26" rx="13"/>
  <text class="chip" x="505" y="255" text-anchor="middle">dev</text>
  <path class="arrow" d="M531,251 H545"/>
  <rect class="t" x="547" y="238" width="42" height="26" rx="13"/>
  <text class="chip" x="568" y="255" text-anchor="middle">qa</text>
  <path class="arrow" d="M591,251 H605"/>
  <rect class="t" x="607" y="238" width="72" height="26" rx="13"/>
  <text class="chip" x="643" y="255" text-anchor="middle">staging</text>
  <text class="s" x="481" y="288">You promote dev and your own</text>
  <text class="s" x="481" y="306">stages. Your QA promotes staging.</text>

  <!-- 4. Prod checklist -->
  <rect class="p" x="725" y="180" width="250" height="236" rx="8"/>
  <text class="tag tag-p" x="741" y="202">PLATFORM CHECKLIST</text>
  <text class="h" x="741" y="224">Prod release</text>
  <text class="k" x="741" y="252">a</text>
  <text class="b" x="757" y="252">Release lead starts it</text>
  <text class="s" x="757" y="270">normal or emergency, plus a note</text>
  <text class="k" x="741" y="298">b</text>
  <text class="b" x="757" y="298">Checks run on their own</text>
  <text class="s" x="757" y="316">scan, policy, CI passed, secrets</text>
  <text class="k" x="741" y="344">c</text>
  <text class="b" x="757" y="344">An approver approves</text>
  <text class="s" x="757" y="362">never someone from your team</text>
  <text class="k" x="741" y="390">d</text>
  <text class="b" x="757" y="390">Released and recorded</text>
  <text class="s" x="757" y="408">who, what, checks, approver</text>

  <line class="stem" x1="850" y1="416" x2="850" y2="434"/>
  <rect class="x" x="725" y="434" width="250" height="66" rx="8"/>
  <text class="b" x="741" y="457">✗ If a check fails</text>
  <text class="s" x="741" y="477">or evidence is missing: blocked,</text>
  <text class="s" x="741" y="494">and the step says why.</text>

  <text class="lbl" x="850" y="518" text-anchor="middle">or</text>
  <rect class="a" x="725" y="528" width="250" height="84" rx="8"/>
  <text class="b" x="741" y="551">In an emergency: break glass</text>
  <text class="s" x="741" y="571">Checks only report. The break-</text>
  <text class="s" x="741" y="588">glass group authorizes, and it's</text>
  <text class="s" x="741" y="605">flagged for review afterwards.</text>

  <!-- 5. Live -->
  <rect class="g" x="985" y="180" width="190" height="130" rx="8"/>
  <text class="tag tag-g" x="1001" y="202">DONE</text>
  <text class="h" x="1001" y="224">Live in prod</text>
  <text class="s" x="1001" y="248">Argo CD or your GitHub</text>
  <text class="s" x="1001" y="266">Actions workflow deploys.</text>
  <text class="s" x="1001" y="290">Full record for audit.</text>

  <!-- Legend -->
  <rect class="t" x="25" y="626" width="14" height="14" rx="3"/>
  <text class="s" x="47" y="638">your team</text>
  <rect class="p" x="135" y="626" width="14" height="14" rx="3"/>
  <text class="s" x="157" y="638">platform, automatic</text>
  <rect class="g" x="295" y="626" width="14" height="14" rx="3"/>
  <text class="s" x="317" y="638">done</text>
  <rect class="x" x="375" y="626" width="14" height="14" rx="3"/>
  <text class="s" x="397" y="638">blocked</text>
  <rect class="a" x="470" y="626" width="14" height="14" rx="3"/>
  <text class="s" x="492" y="638">emergency path</text>
</svg>
