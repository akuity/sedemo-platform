apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: kargo-apps
  namespace: argocd
spec:
  generators:
  - git:
      repoURL: https://github.com/akuity/sedemo-platform
      revision: HEAD
      directories:
      - path: apps/*/kargo
  template:
    metadata:
      name: 'kargo-{{path[1]}}'
    spec:
      project: '{{path[1]}}'
      source:
        repoURL: https://github.com/akuity/sedemo-platform
        targetRevision: HEAD
        path: '{{path}}'
        directory:
          recurse: true
      destination:
        name: kargo
      # The promotion-window on/off switch is meant to be flipped live during a
      # demo, so self-heal must not stamp it back. Only team-namho defines
      # promotionWindows today; this is a no-op for every other project.
      ignoreDifferences:
      - group: kargo.akuity.io
        kind: ProjectConfig
        jqPathExpressions:
        - .spec.promotionWindows[]?.disabled
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
        - CreateNamespace=true
        # Without this, ignoreDifferences only hides the drift -- sync still
        # overwrites it.
        - RespectIgnoreDifferences=true
