# Connector tokens for the twingate-connector Application
# (components/declarations/twingate). The chart reads them via
# connector.existingSecret as TWINGATE_ACCESS_TOKEN / TWINGATE_REFRESH_TOKEN.
#
# Synced by eso-secret-store-kargo, a different app from the connector, so sync
# that app first: the connector pod won't start until this Secret exists.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: twingate-connector-tokens
  namespace: twingate
spec:
  refreshInterval: 1h
  # our actual secret store is in EKS cluster default NS
  secretStoreRef:
    name: aws-secretsmanager
    kind: ClusterSecretStore
  target:
    name: twingate-connector-tokens
  data:
  - secretKey: TWINGATE_ACCESS_TOKEN
    remoteRef:
      key: sedemo/twingate
      property: access-token
  - secretKey: TWINGATE_REFRESH_TOKEN
    remoteRef:
      key: sedemo/twingate
      property: refresh-token
