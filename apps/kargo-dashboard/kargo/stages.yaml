apiVersion: kargo.akuity.io/v1alpha1
kind: Stage
metadata:
  name: demo
  namespace: kargo-dashboard
  annotations:
    kargo.akuity.io/color: blue
spec:
  shard: sedemo-primary
  requestedFreight:
  - origin:
      kind: Warehouse
      name: kargo-dashboard
    sources:
      direct: true
  promotionTemplate:
    spec:
      vars:
      - name: gitRepo
        value: https://github.com/akuity/sedemo-monorepo
      - name: outRepo
        value: https://github.com/akuity/sedemo-platform
      - name: imageRepo
        value: ghcr.io/akuity/sedemo-monorepo-kargo-dashboard
      # Must match the branch the Argo CD ApplicationSet tracks (argocd/application-set.yaml):
      # rendered/kargo-dashboard/{{stage}} for the "demo" element.
      - name: targetBranch
        value: rendered/kargo-dashboard/${{ ctx.stage }}
      steps:
      - uses: git-clone
        config:
          repoURL: ${{ vars.gitRepo }}
          checkout:
          - branch: main
            path: ./src
      - uses: git-clone
        config:
          repoURL: ${{ vars.outRepo }}
          checkout:
          - branch: ${{ vars.targetBranch }}
            create: true
            path: ./out
      - uses: git-clear
        config:
          path: ./out
      - uses: helm-template
        config:
          releaseName: deploy
          path: ./src/kargo-dashboard/deploy/chart
          valuesFiles:
          - ./src/kargo-dashboard/deploy/chart/values.yaml
          outPath: ./out/manifests.yaml
          namespace: kargo-dashboard-${{ ctx.stage }}
          setValues:
          - key: image.tag
            value: "${{ imageFrom(vars.imageRepo).Tag }}"
          - key: ingress.root_domain
            value: akpdemoapps.link
      - uses: git-commit
        config:
          path: ./out
          message: "Promote ${{ imageFrom(vars.imageRepo).Tag }} to ${{ ctx.stage }} [skip ci]"
      - uses: git-push
        config:
          path: ./out
          targetBranch: ${{ vars.targetBranch }}
      - uses: argocd-update
        continueOnError: true
        config:
          apps:
          - name: kargo-dashboard-${{ ctx.stage }}
            namespace: argocd
