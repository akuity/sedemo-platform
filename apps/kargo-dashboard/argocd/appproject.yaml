apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: kargo-dashboard
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  description: Kargo Porfolio Management Dashboard
  sourceRepos:
    - '*'
  destinations:
    - server: '*'
      name: '*'
      namespace: '*'
  clusterResourceWhitelist:
    - group: '*'
      kind: '*'
