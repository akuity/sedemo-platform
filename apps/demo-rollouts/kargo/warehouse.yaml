apiVersion: kargo.akuity.io/v1alpha1
kind: Warehouse
metadata:
  name: demo-rollouts
  namespace: demo-rollouts
spec:
  subscriptions:
  - image:
      repoURL: ghcr.io/akuity/sedemo-monorepo-rollouts-app
      discoveryLimit: 5
      imageSelectionStrategy: NewestBuild
      allowTagsRegexes:
      - ^\d*-[a-z]*$
  - git:
      repoURL: https://github.com/akuity/sedemo-monorepo
      includePaths:
      - rollouts-app
  # because a commit will come before the corresponding image is publishes, we check the annotation the image
  # and only create when they match. 
  freightCreationCriteria:
    expression: |
      imageFrom('ghcr.io/akuity/sedemo-monorepo-rollouts-app').annotations['org.opencontainers.image.revision'] == commitFrom('https://github.com/akuity/sedemo-monorepo').ID