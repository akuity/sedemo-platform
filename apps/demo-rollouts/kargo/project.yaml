apiVersion: kargo.akuity.io/v1alpha1
kind: Project
metadata:
  name: demo-rollouts
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
---
apiVersion: kargo.akuity.io/v1alpha1
kind: ProjectConfig
metadata:
  name: demo-rollouts
  namespace: demo-rollouts
spec:
  stageLinks:
  - title: App UI
    description: Rollouts demo app; the error dial here drives the auto-rollback beat
    url: 'https://demo-{{ .stage.metadata.name }}.akpdemoapps.link'
    if: stage.metadata.name not in ["prod"]
  freightLinks:
  - title: Commit
    description: The git commit carried by this Freight 
    url: '{{ (index .freight.commits 0).repoURL }}/commit/{{ (index .freight.commits 0).id }}'
    if: freight.commits != nil && len(freight.commits) > 0
  - title: Docker Image 
    description: The docker image carried by this Freight 
    url: 'https://github.com/akuity/sedemo-monorepo/pkgs/container/sedemo-monorepo-rollouts-app/{{ (index .freight.images 0).Digest }}?tag={{ (index .freight.images 0).Tag }}'
  promotionPolicies:
  - stageSelector:
      name: "regex:prod.*"
    autoPromotionEnabled: true