apiVersion: kargo.akuity.io/v1alpha1
kind: Warehouse
metadata:
  name: app
  namespace: beyond-k8s
spec:
  subscriptions:
  - image:
      repoURL: ghcr.io/akuity/guestbook
      imageSelectionStrategy: SemVer
  - git:
      repoURL: https://github.com/akuity/sedemo-monorepo
      # we only care about beyond-k8s app
      includePaths:
      - beyond-k8s
      # but not our own commits to env nor changes to lambda code
      excludePaths:
      - 'beyond-k8s/lambda'
      - 'beyond-k8s/env'
      - 'beyond-k8s/fargate'
---
apiVersion: kargo.akuity.io/v1alpha1
kind: Warehouse
metadata:
  name: fargate
  namespace: beyond-k8s
spec:
  subscriptions:
  - image:
      repoURL: ghcr.io/akuity/sedemo-monorepo-fargate-app
      imageSelectionStrategy: SemVer
  - git:
      repoURL: https://github.com/akuity/sedemo-monorepo
      # we only care about beyond-k8s app
      includePaths:
      - beyond-k8s/fargate