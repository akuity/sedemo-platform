      - name: path_src
        value: ./src
      - name: path_out
        value: ./out
      steps:
      - task:
          name: prepare-workdir 
      - uses: helm-template
        config:
          releaseName: deploy
          path: ${{ vars.path_src }}/verification-snow-demo/deploy/chart
          valuesFiles:
          - ${{ vars.path_src }}/verification-snow-demo/deploy/chart/values.yaml
          outPath: ${{ vars.path_out }}/base/manifests.yaml
          namespace: snow-demo-staging
          setValues:
            - key: image.tag
              value: ${{ imageFrom(vars.imageRepo).Tag }}
            - key: kargo.stage
              value: ${{ ctx.stage }}
            - key: ingress.root_domain
              value: akpdemoapps.link
      - uses: copy
        config:
          inPath: ${{ vars.path_src }}/verification-snow-demo/deploy/overlays/staging
          outPath: ${{ vars.path_out }}
      - task:
          name: push-manifests
      - uses: argocd-update
        continueOnError: true
        config:
          apps:
          # - name: demo-snow-staging
          #   namespace: argocd
          - selector:
              matchLabels:
                app.kubernetes.io/part-of: demo-snow
                kargo.akuity.io/stage: staging
