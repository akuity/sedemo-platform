
apiVersion: kargo.akuity.io/v1alpha1
kind: Stage
metadata:
  name: close-change-task
  namespace: demo-snow
  annotations:
    kargo.akuity.io/color: red
spec:
  shard: sedemo-primary
  requestedFreight:
  - origin:
      kind: Warehouse
      name: demo-snow
    sources:
      direct: true
  promotionTemplate:
    spec:
      steps:
      - as: snowquery
        config:
          credentials:
            sharedSecretName: kargo-step-snow
            type: basic
          query:
            change_request: CHG0030001
            state: "2"
          tableName: change_task
        uses: snow-query-records
      - as: dumpit
        uses: compose-output
        config:
          value: ${{ outputs['snowquery'].number }}
      - as: snow-ct-close
        config:
          credentials:
            sharedSecretName: kargo-step-snow
            type: basic
          parameters:
            state: "3"
            close_notes: "Automatically closing change task after ${{ status('dumpit') }} promotion to prod."
            work_notes: "Automatically closing change task after ${{ status('dumpit') }} promotion to prod."
          tableName: change_task
          ticketId: ${{ outputs['snowquery'].sys_id }}
        uses: snow-update
