apiVersion: kargo.akuity.io/v1alpha1
kind: Stage
metadata:
  name: dev
  namespace: demo-snow
  annotations:
    kargo.akuity.io/color: red
spec:
  shard: sedemo-primary
  requestedFreight:
  - origin:
      kind: Warehouse
      name: demo-snow
    sources:
      direct: true
  # verification:
  #   analysisTemplates:
  #     - name: integration-test
  #       kind: ClusterAnalysisTemplate
  verification:
    analysisTemplates:
    - name: prometheus-verification
    args:
    - name: namespace
      value: snow-demo-dev
  promotionTemplate:
    spec:
      vars:
      - name: gitRepo
        value: https://github.com/akuity/sedemo-monorepo
      - name: imageRepo
        value: ghcr.io/akuity/sedemo-monorepo-snow-demo
      - name: targetBranch
        value: env-snow-demo/dev 
      - name: path_src
        value: ./src
      - name: path_out
        value: ./out
      steps:
      - task:
          name: prepare-workdir 
      - uses: helm-template
        config:
          releaseName: deploy
          path: ${{ vars.path_src }}/verification-snow-demo/deploy/chart
          valuesFiles:
          - ${{ vars.path_src }}/verification-snow-demo/deploy/chart/values.yaml
          outPath: ${{ vars.path_out }}/base/manifests.yaml
          namespace: snow-demo-dev
          setValues:
            - key: image.tag
              value: ${{ imageFrom(vars.imageRepo).Tag }}
            - key: kargo.stage
              value: ${{ ctx.stage }}
            - key: ingress.root_domain
              value: akpdemoapps.link
      - uses: copy
        config:
          inPath: ${{ vars.path_src }}/verification-snow-demo/deploy/overlays/dev
          outPath: ${{ vars.path_out }}
      - uses: kyverno-policy-check
        as: kyverno
      - task:
          name: push-manifests
      - uses: argocd-update
        continueOnError: true
        config:
          apps:
          # - name: demo-snow-dev
          #   namespace: argocd
          - selector:
              matchLabels:
                app.kubernetes.io/part-of: demo-snow
                kargo.akuity.io/stage: dev
      - uses: hello-world
        as: my-custom-step
        config: 
          message: "Hello, World! It's Kargo!"
