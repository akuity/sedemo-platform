          credentials:
            sharedSecretName: kargo-step-snow
            type: basic
          parameters:
            state: "3"
            close_notes: "Automatically closing testing task."
            work_notes: "Automatically closing testing task."
          tableName: change_task
          ticketId: ${{ outputs['get-snow-task-testing'].sys_id}}
        uses: snow-update
      - as: snow-ct-close
        config:
          credentials:
            sharedSecretName: kargo-step-snow
            type: basic
          parameters:
            state: "3"
            close_notes: "Automatically closing testing task."
            work_notes: "Automatically closing testing task."
          tableName: change_request
          ticketId: ${{ freightMetadata(ctx.targetFreight.name)['snow-chg']}}
        uses: snow-update