apiVersion: kargo.akuity.io/v1alpha1
kind: Stage
metadata:
  name: prod
  namespace: demo-snow
  annotations:
    kargo.akuity.io/color: violet
spec:
  requestedFreight:
  - origin:
      kind: Warehouse
      name: demo-snow
    sources:
      stages:
      - staging
  promotionTemplate:
    spec:
      vars:
      - name: gitRepo
        value: https://github.com/akuity/sedemo-monorepo
      - name: imageRepo
        value: ghcr.io/akuity/sedemo-monorepo-snow-demo
      - name: targetBranch
        value: env-snow-demo/prod
      - name: path_src
        value: ./src
      - name: path_out
        value: ./out
      steps:
      - task:
          name: prepare-workdir 
      - uses: helm-template
        vars:
        - name: region
          value: amer-east
        config:
          releaseName: deploy
          path: ${{ vars.path_src }}/verification-snow-demo/deploy/chart
          valuesFiles:
          - ${{ vars.path_src }}/verification-snow-demo/deploy/chart/values.yaml
          outPath: ${{ vars.path_out }}/manifests-${{ vars.region }}.yaml
          namespace: snow-demo-prod-amer-east
          setValues:
            - key: image.tag
              value: ${{ imageFrom(vars.imageRepo).Tag }}
            - key: kargo.stage
              value: ${{ ctx.stage }}-amer-east
            - key: ingress.root_domain
              value: akpdemoapps.link
      - uses: helm-template
        vars:
        - name: region
          value: amer-west
        config:
          releaseName: deploy
          path: ${{ vars.path_src }}/verification-snow-demo/deploy/chart
          valuesFiles:
          - ${{ vars.path_src }}/verification-snow-demo/deploy/chart/values.yaml
          outPath: ${{ vars.path_out }}/manifests-${{ vars.region }}.yaml
          namespace: snow-demo-prod-amer-west
          setValues:
            - key: image.tag
              value: ${{ imageFrom(vars.imageRepo).Tag }}
            - key: kargo.stage
              value: ${{ ctx.stage }}-amer-west
            - key: ingress.root_domain
              value: akpdemoapps.link
      - uses: helm-template
        vars:
        - name: region
          value: emea
        config:
          releaseName: deploy
          path: ${{ vars.path_src }}/verification-snow-demo/deploy/chart
          valuesFiles:
          - ${{ vars.path_src }}/verification-snow-demo/deploy/chart/values.yaml
          outPath: ${{ vars.path_out }}/manifests-${{ vars.region }}.yaml
          namespace: snow-demo-prod-emea
          setValues:
            - key: image.tag
              value: ${{ imageFrom(vars.imageRepo).Tag }}
            - key: kargo.stage
              value: ${{ ctx.stage }}-emea
            - key: ingress.root_domain
              value: akpdemoapps.link
      - uses: copy
        config:
          inPath: ${{ vars.path_src }}/verification-snow-demo/deploy/overlays/prod-amer-east
          outPath: ${{ vars.path_out }}/prod-amer-east
      - uses: copy
        config:
          inPath: ${{ vars.path_src }}/verification-snow-demo/deploy/overlays/prod-amer-west
          outPath: ${{ vars.path_out }}/prod-amer-west
      - uses: copy
        config:
          inPath: ${{ vars.path_src }}/verification-snow-demo/deploy/overlays/prod-emea
          outPath: ${{ vars.path_out }}/prod-emea
      - task:
          name: push-manifests
        as: push-manifests
      - as: snowcreate
        config:
          credentials:
            sharedSecretName: kargo-step-snow
            type: basic
          parameters:
            impact: "3"
            short_description: Deploy to ${{ ctx.stage }} complete for ${{ vars.imageRepo }}:${{ imageFrom(vars.imageRepo).Tag }}
            assignment_group: "Application Development"
            urgency: "3"
            implementation_plan: "See https://kargo.akpdemoapps.link/project/${{ ctx.project }}/promotion/${{ ctx.promotion }}"
          tableName: change_request
          template:
            #templateId: 8d3380da83273210b6207e95eeaad33e # example
            type: normal
        uses: snow-create
      - as: create-snow-task-amer-east
        config:
          credentials:
            sharedSecretName: kargo-step-snow
            type: basic
          parameters:
            change_request: ${% outputs['snowcreate'].number %}
            type: "implementation"
            short_description: Deploy ${{ imageFrom(vars.imageRepo).Tag }} to amer-east
          tableName: change_task
        uses: snow-create
      - as: create-snow-task-amer-west
        config:
          credentials:
            sharedSecretName: kargo-step-snow
            type: basic
          parameters:
            change_request: ${% outputs['snowcreate'].number %}
            type: "implementation"
            short_description: Deploy ${{ imageFrom(vars.imageRepo).Tag }} to amer-west
          tableName: change_task
        uses: snow-create
      - as: create-snow-task-emea
        config:
          credentials:
            sharedSecretName: kargo-step-snow
            type: basic
          parameters:
            change_request: ${% outputs['snowcreate'].number %}
            type: "implementation"
            short_description: Deploy ${{ imageFrom(vars.imageRepo).Tag }} to emea
          tableName: change_task
        uses: snow-create
      - uses: set-metadata
        config:
          updates:
            - kind: Freight
              name: ${{ ctx.targetFreight.name }}
              values:
                snow-url: "https://${{ sharedSecret('kargo-step-snow').instanceURL }}/change_request.do?sys_id=${{ outputs['snowcreate'].sys_id }}"
                snow-chg: "${{ outputs['snowcreate'].number }}"
                snow-id: "${{ outputs['snowcreate'].sys_id }}"
                snow-east-task: "${{ outputs['create-snow-task-amer-east'].sys_id }}"
                snow-west-task: "${{ outputs['create-snow-task-amer-west'].sys_id }}"
                snow-emea-task: "${{ outputs['create-snow-task-emea'].sys_id }}"
      - as: snow-wait-for-condition
        config:
          # wait for "Implment" state
          condition: state=-1
          credentials:
            sharedSecretName: kargo-step-snow
            type: basic
          tableName: change_request
          ticketId: ${% outputs['snowcreate'].sys_id %}
        uses: snow-wait-for-condition
      # - as: snowupdate
      #   config:
      #     credentials:
      #       sharedSecretName: kargo-step-snow
      #       type: basic
      #     parameters:
      #       state: "Review"
      #       work_notes: "Promotion to prod successful, moving change request to Review state."
      #     tableName: change_request
      #     ticketId: ${% outputs['snowcreate'].sys_id %}
      #   uses: snow-update





    

---
apiVersion: kargo.akuity.io/v1alpha1
kind: Stage
metadata:
  name: prod-amer-east
  namespace: demo-snow
  annotations:
    kargo.akuity.io/color: violet
spec:
  requestedFreight:
  - origin:
      kind: Warehouse
      name: demo-snow
    sources:
      stages:
      - prod
      autoPromotionOptions:
        selectionPolicy: MatchUpstream
  promotionTemplate:
    spec:
      vars:
      - name: gitRepo
        value: https://github.com/akuity/sedemo-monorepo
      - name: imageRepo
        value: ghcr.io/akuity/sedemo-monorepo-snow-demo
      - name: region
        value: amer-east
      steps:
      - task:
          name: prepare-workdir
        vars  :
        - name: sourceBranch
          value: env-snow-demo/prod
        - name: targetBranch
          value: env-snow-demo/prod-${{ vars.region }}
      - uses: copy
        config:
          inPath: ./src/prod-amer-east
          outPath: ./out
      - uses: copy
        config:
          inPath: ./src/manifests-${{ vars.region }}.yaml
          outPath: ./out/base/manifests.yaml
      - task:
          name: push-manifests
        vars:
        - name: sourceBranch
          value: env-snow-demo/prod
        - name: targetBranch
          value: env-snow-demo/prod-${{ vars.region }}
      - uses: argocd-update
        as: argocd-update
        continueOnError: true
        config:
          apps:
          # - name: demo-snow-prod-${{ vars.region }}
          #   namespace: argocd
          - selector:
              matchLabels:
                app.kubernetes.io/part-of: demo-snow
                kargo.akuity.io/stage: prod-${{ vars.region }}

      

      - as: snow-ct-close
        config:
          credentials:
            sharedSecretName: kargo-step-snow
            type: basic
          parameters:
            state: "3"
            close_notes: "Automatically closing change task after ${{ status('argocd-update') }} promotion to prod."
            work_notes: "Automatically closing change task after ${{ status('argocd-update') }} promotion to prod."
          tableName: change_task
          ticketId: ${{ freightMetadata(ctx.targetFreight.name)['snow-east-task']}}
        uses: snow-update

     

