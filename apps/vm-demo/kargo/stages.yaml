---
apiVersion: kargo.akuity.io/v1alpha1
kind: Stage
metadata:
  name: uat
  namespace: vm-demo
  annotations:
    kargo.akuity.io/color: orange
spec:
  shard: team-ada
  requestedFreight:
  - origin:
      kind: Warehouse
      name: app
    sources:
      stages:
      - sit
  - origin:
      kind: Warehouse
      name: base-image
    sources:
      stages:
      - sit
  verification:
    analysisTemplates:
    - name: vm-health
    args:
    - name: stage
      value: uat
    - name: expectedCount
      value: "1"
    - name: smoke
      value: "false"
    - name: appVersion
      value: ${{ imageFrom("ghcr.io/akuity/sedemo-monorepo-rollouts-app", warehouse("app")).Tag }}
  promotionTemplate:
    spec:
      steps:
      - task:
          name: vm-render
        as: render
      # The PR diff is exactly what will land on the VM: rollouts-demo.env and the
      # deploy pin (app version, artifact, base template).
      - uses: git-push
        as: pr-push
        if: ${{ outputs.render.changed }}
        config:
          path: ./out
          generateTargetBranch: true
      - uses: git-open-pr
        as: open-pr
        if: ${{ outputs.render.changed }}
        config:
          repoURL: https://github.com/akuity/sedemo-platform
          sourceBranch: ${{ outputs['pr-push'].branch }}
          targetBranch: rendered/vm-demo/uat
          title: "vm-demo uat: ${{ outputs.render.appVersion }} / ${{ outputs.render.baseTemplate }}"
          description: |
            Kargo promotion of Freight `${{ ctx.targetFreight.name }}` to `uat`.

            - app: `${{ outputs.render.appVersion }}`
            - base template: `${{ outputs.render.baseTemplate }}`
            - promotion: https://kargo.akpdemoapps.link/project/${{ ctx.project }}/promotion/${{ ctx.promotion }}

            Merging this PR lets the promotion continue: it then runs
            converge.yml for `uat` against the merge commit.
      - uses: git-wait-for-pr
        as: merged
        if: ${{ outputs.render.changed }}
        config:
          repoURL: https://github.com/akuity/sedemo-platform
          prNumber: ${{ outputs['open-pr'].pr.id }}
      # Audit: who merged the SysOps PR (human input). GitHub's public API
      # reports merged_by; the PR lives in this public repo.
      - uses: http
        as: pr-info
        if: ${{ outputs.render.changed }}
        retry:
          errorThreshold: 3
        config:
          url: https://api.github.com/repos/akuity/sedemo-platform/pulls/${{ outputs['open-pr'].pr.id }}
          headers:
          - name: Accept
            value: application/vnd.github+json
          successExpression: response.status == 200
          outputs:
          - name: mergedBy
            fromExpression: response.body.merged_by.login
          - name: url
            fromExpression: response.body.html_url
      - uses: record-audit-event
        as: audit-pr-merged
        if: ${{ outputs.render.changed }}
        retry:
          errorThreshold: 3
        config:
          type: pr-merged
          actor: github:${{ outputs['pr-info'].mergedBy }}
          message: "Rendered config PR #${{ outputs['open-pr'].pr.id }} for ${{ ctx.stage }} merged by ${{ outputs['pr-info'].mergedBy }}"
          data:
            pr: ${{ outputs['pr-info'].url }}
            mergeCommit: ${{ outputs.merged.commit }}
      - task:
          name: vm-converge
        vars:
        - name: release
          value: "${{ outputs.render.appVersion }} on ${{ outputs.render.baseTemplate }}"
        - name: platformRef
          value: "${{ outputs.render.changed ? outputs.merged?.commit : outputs.render.commit }}"
---
apiVersion: kargo.akuity.io/v1alpha1
kind: Stage
metadata:
  name: prod
  namespace: vm-demo
  annotations:
    kargo.akuity.io/color: red
spec:
  shard: team-ada
  requestedFreight:
  - origin:
      kind: Warehouse
      name: app
    sources:
      stages:
      - uat
  - origin:
      kind: Warehouse
      name: base-image
    sources:
      stages:
      - uat
  verification:
    analysisTemplates:
    - name: vm-health
    args:
    - name: stage
      value: prod
    # Cut order item 2: "1" if prod drops to a single VM.
    - name: expectedCount
      value: "2"
    - name: smoke
      value: "false"
    - name: appVersion
      value: ${{ imageFrom("ghcr.io/akuity/sedemo-monorepo-rollouts-app", warehouse("app")).Tag }}
  promotionTemplate:
    spec:
      steps:
      - task:
          name: vm-render
        as: render
      - uses: git-push
        as: pr-push
        if: ${{ outputs.render.changed }}
        config:
          path: ./out
          generateTargetBranch: true
      - uses: git-open-pr
        as: open-pr
        if: ${{ outputs.render.changed }}
        config:
          repoURL: https://github.com/akuity/sedemo-platform
          sourceBranch: ${{ outputs['pr-push'].branch }}
          targetBranch: rendered/vm-demo/prod
          title: "vm-demo prod: ${{ outputs.render.appVersion }} / ${{ outputs.render.baseTemplate }}"
          description: |
            Kargo promotion of Freight `${{ ctx.targetFreight.name }}` to `prod`.

            - app: `${{ outputs.render.appVersion }}`
            - base template: `${{ outputs.render.baseTemplate }}`
            - promotion: https://kargo.akpdemoapps.link/project/${{ ctx.project }}/promotion/${{ ctx.promotion }}

            Gated by a Jira CHANGE issue. Once the issue is Approved and this
            PR is merged, the promotion runs converge.yml for `prod`
            (one VM at a time) against the merge commit.
      # Release diff for the change ticket: what prod runs now (previous
      # deploy pin) against what this promotion brings, for the app source,
      # the config chart, and the base image's OS packages.
      - uses: git-clone
        as: infra-prev
        if: ${{ outputs.render.prevInfraCommit != '' && outputs.render.prevInfraCommit != outputs.render.infraCommit }}
        config:
          repoURL: https://github.com/akuity/sedemo-vm-infra
          checkout:
          - commit: ${{ outputs.render.prevInfraCommit }}
            path: ./infra-prev
      - uses: vm-release-diff
        as: diff
        config:
          repoURL: https://github.com/akuity/sedemo-monorepo
          prevAppRevision: ${{ outputs.render.prevAppRevision }}
          appRevision: ${{ outputs.render.appRevision }}
          prevChartCommit: ${{ outputs.render.prevChartCommit }}
          chartCommit: ${{ outputs.render.chartCommit }}
          prevPackages: "${{ outputs.render.prevInfraCommit == outputs.render.infraCommit ? './infra/images/packages.txt' : './infra-prev/images/packages.txt' }}"
          packages: ./infra/images/packages.txt
      - uses: jira
        as: change
        config:
          credentials:
            sharedSecretName: jira-access-secret
          createIssue:
            projectKey: CHANGE
            issueType: Task
            summary: "vm-demo prod: rollouts-app ${{ outputs.render.appVersion }} on base ${{ outputs.render.baseTemplate }}"
            labels:
            - vm-demo
            adfDescription:
              type: doc
              version: 1
              content:
                - type: heading
                  attrs:
                    level: 3
                  content:
                  - type: text
                    text: "Release to prod"
                - type: paragraph
                  content:
                  - type: text
                    text: "Rendered config PR (exactly what lands on vm-prod-1, vm-prod-2): "
                  - type: text
                    text: "${{ outputs['open-pr']?.pr?.url ?? 'none, render identical to prod' }}"
                    marks:
                    - type: link
                      attrs:
                        href: "${{ outputs['open-pr']?.pr?.url ?? 'https://github.com/akuity/sedemo-platform/tree/rendered/vm-demo/prod' }}"
                  - type: text
                    text: ". Kargo promotion: "
                  - type: text
                    text: "${{ ctx.promotion }}"
                    marks:
                    - type: link
                      attrs:
                        href: "https://kargo.akpdemoapps.link/project/${{ ctx.project }}/promotion/${{ ctx.promotion }}"
                  - type: text
                    text: ". Move this issue to Approved to release."
                - type: heading
                  attrs:
                    level: 3
                  content:
                  - type: text
                    text: "Application"
                - type: paragraph
                  content:
                  - type: text
                    text: "rollouts-app "
                  - type: text
                    text: "${{ ((outputs.render.prevAppVersion ?? '') != '' ? outputs.render.prevAppVersion : '(none)') }} -> ${{ outputs.render.appVersion }}"
                    marks:
                    - type: code
                  - type: text
                    text: " ("
                  - type: text
                    text: "source changes"
                    marks:
                    - type: link
                      attrs:
                        href: "${{ outputs.render.prevAppRevision != '' ? 'https://github.com/akuity/sedemo-monorepo/compare/' + outputs.render.prevAppRevision + '...' + outputs.render.appRevision : 'https://github.com/akuity/sedemo-monorepo/commit/' + outputs.render.appRevision }}"
                  - type: text
                    text: ")"
                - type: codeBlock
                  content:
                  - type: text
                    text: "${{ outputs.diff.appLog }}"
                - type: heading
                  attrs:
                    level: 3
                  content:
                  - type: text
                    text: "Configuration"
                - type: paragraph
                  content:
                  - type: text
                    text: "Config chart vm-app/config-chart ("
                  - type: text
                    text: "chart changes"
                    marks:
                    - type: link
                      attrs:
                        href: "${{ outputs.render.prevChartCommit != '' ? 'https://github.com/akuity/sedemo-monorepo/compare/' + outputs.render.prevChartCommit + '...' + outputs.render.chartCommit : 'https://github.com/akuity/sedemo-monorepo/commit/' + outputs.render.chartCommit }}"
                  - type: text
                    text: ")"
                - type: codeBlock
                  content:
                  - type: text
                    text: "${{ outputs.diff.chartLog }}"
                - type: heading
                  attrs:
                    level: 3
                  content:
                  - type: text
                    text: "Base image"
                - type: paragraph
                  content:
                  - type: text
                    text: "${{ ((outputs.render.prevBaseTemplate ?? '') != '' ? outputs.render.prevBaseTemplate : '(none)') }} -> ${{ outputs.render.baseTemplate }}"
                    marks:
                    - type: code
                  - type: text
                    text: ", OS packages: "
                  - type: text
                    text: "${{ outputs.diff.packagesSummary }}"
                    marks:
                    - type: strong
                  - type: text
                    text: " ("
                  - type: text
                    text: "image build changes"
                    marks:
                    - type: link
                      attrs:
                        href: "${{ outputs.render.prevInfraCommit != '' ? 'https://github.com/akuity/sedemo-vm-infra/compare/' + outputs.render.prevInfraCommit + '...' + outputs.render.infraCommit : 'https://github.com/akuity/sedemo-vm-infra/commit/' + outputs.render.infraCommit }}"
                  - type: text
                    text: ")"
                - type: codeBlock
                  content:
                  - type: text
                    text: "${{ outputs.diff.packagesDiff }}"
      - uses: set-metadata
        config:
          updates:
          - kind: Freight
            name: ${{ ctx.targetFreight.name }}
            values:
              jira-issue-key: ${{ outputs.change.key }}
              pr-url: ${{ outputs['open-pr']?.pr?.url ?? '' }}
      - uses: jira
        as: change-approved
        config:
          credentials:
            sharedSecretName: jira-access-secret
          waitForStatus:
            issueKey: ${{ outputs.change.key }}
            expectedStatus: Approved
      # Audit: who approved the CHANGE issue (human input). The jira step's
      # changelog names the user who moved it to Approved.
      - uses: jira
        as: approval
        retry:
          errorThreshold: 3
        config:
          credentials:
            sharedSecretName: jira-access-secret
          searchIssue:
            jql: key = ${{ outputs.change.key }}
            fields:
            - status
            expands:
            - changelog
      - uses: record-audit-event
        as: audit-change-approved
        retry:
          errorThreshold: 3
        config:
          type: change-approved
          actor: "jira:${{ last(filter(outputs.approval.issue.changelog.histories, any(.items, .field == 'status' && .toString == 'Approved')))?.author?.displayName ?? 'unknown' }}"
          message: "${{ outputs.change.key }} approved by ${{ last(filter(outputs.approval.issue.changelog.histories, any(.items, .field == 'status' && .toString == 'Approved')))?.author?.displayName ?? 'unknown' }} for ${{ outputs.render.appVersion }} on ${{ outputs.render.baseTemplate }}"
          data:
            issue: https://eddiewebb.atlassian.net/browse/${{ outputs.change.key }}
      - uses: git-wait-for-pr
        as: merged
        if: ${{ outputs.render.changed }}
        config:
          repoURL: https://github.com/akuity/sedemo-platform
          prNumber: ${{ outputs['open-pr'].pr.id }}
      # Audit: who merged the SysOps PR (human input). GitHub's public API
      # reports merged_by; the PR lives in this public repo.
      - uses: http
        as: pr-info
        if: ${{ outputs.render.changed }}
        retry:
          errorThreshold: 3
        config:
          url: https://api.github.com/repos/akuity/sedemo-platform/pulls/${{ outputs['open-pr'].pr.id }}
          headers:
          - name: Accept
            value: application/vnd.github+json
          successExpression: response.status == 200
          outputs:
          - name: mergedBy
            fromExpression: response.body.merged_by.login
          - name: url
            fromExpression: response.body.html_url
      - uses: record-audit-event
        as: audit-pr-merged
        if: ${{ outputs.render.changed }}
        retry:
          errorThreshold: 3
        config:
          type: pr-merged
          actor: github:${{ outputs['pr-info'].mergedBy }}
          message: "Rendered config PR #${{ outputs['open-pr'].pr.id }} for ${{ ctx.stage }} merged by ${{ outputs['pr-info'].mergedBy }}"
          data:
            pr: ${{ outputs['pr-info'].url }}
            mergeCommit: ${{ outputs.merged.commit }}
      - task:
          name: vm-converge
        vars:
        - name: release
          value: "${{ outputs.render.appVersion }} on ${{ outputs.render.baseTemplate }}"
        - name: platformRef
          value: "${{ outputs.render.changed ? outputs.merged?.commit : outputs.render.commit }}"
      - uses: jira
        config:
          credentials:
            sharedSecretName: jira-access-secret
          commentOnIssue:
            issueKey: ${{ outputs.change.key }}
            body: "Deployed ${{ outputs.render.appVersion }} on base ${{ outputs.render.baseTemplate }} to vm-prod-1, vm-prod-2 (rolling) and verified. Promotion: ${{ ctx.promotion }}."
