# Pipeline: dev -> qa -> sit -> uat -> prod.
#
# Every Stage:
#   - runs on the self-hosted `team-ada` shard, whose (homelab) cluster can reach the
#     Proxmox API and the VMs (verification depends on that);
#   - requests Freight from both Warehouses (app, base-image);
#   - renders with PromotionTask vm-render and converges with vm-converge
#     (tasks.yaml);
#   - verifies with AnalysisTemplate vm-health (analysis-template.yaml).
#
# dev, qa, sit push the render straight to rendered/vm-demo/<stage>.
# uat, prod open a PR into that branch and wait for a human to merge it;
# prod also waits on a Jira CHANGE issue reaching Approved.
#
# When a re-promotion renders identical files (autoRollback, retries) the
# commit is a no-op: direct stages push nothing new, PR stages skip the PR,
# and every stage still converges the branch head.
apiVersion: kargo.akuity.io/v1alpha1
kind: Stage
metadata:
  name: dev
  namespace: vm-demo
  annotations:
    kargo.akuity.io/color: green
spec:
  shard: team-ada
  requestedFreight:
  - origin:
      kind: Warehouse
      name: app
    sources:
      direct: true
  - origin:
      kind: Warehouse
      name: base-image
    sources:
      direct: true
  verification:
    analysisTemplates:
    - name: vm-health
    args:
    - name: stage
      value: dev
    - name: expectedCount
      value: "1"
    - name: smoke
      value: "false"
    - name: appVersion
      value: ${{ imageFrom("ghcr.io/akuity/sedemo-monorepo-rollouts-app", warehouse("app")).Tag }}
  promotionTemplate:
    spec:
      steps:
      - task:
          name: vm-render
        as: render
      - uses: git-push
        as: push
        config:
          path: ./out
          targetBranch: rendered/vm-demo/dev
      - task:
          name: vm-converge
        vars:
        - name: platformRef
          value: ${{ outputs.push.commit }}
---
apiVersion: kargo.akuity.io/v1alpha1
kind: Stage
metadata:
  name: qa
  namespace: vm-demo
  annotations:
    kargo.akuity.io/color: teal
spec:
  shard: team-ada
  requestedFreight:
  - origin:
      kind: Warehouse
      name: app
    sources:
      stages:
      - dev
  - origin:
      kind: Warehouse
      name: base-image
    sources:
      stages:
      - dev
  verification:
    analysisTemplates:
    - name: vm-health
    args:
    - name: stage
      value: qa
    - name: expectedCount
      value: "1"
    # Cut order item 1: set to "false" to drop the qa smoke checks.
    - name: smoke
      value: "true"
    - name: appVersion
      value: ${{ imageFrom("ghcr.io/akuity/sedemo-monorepo-rollouts-app", warehouse("app")).Tag }}
  promotionTemplate:
    spec:
      steps:
      - task:
          name: vm-render
        as: render
      - uses: git-push
        as: push
        config:
          path: ./out
          targetBranch: rendered/vm-demo/qa
      - task:
          name: vm-converge
        vars:
        - name: platformRef
          value: ${{ outputs.push.commit }}
---
