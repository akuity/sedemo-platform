    - name: appVersion
      value: ${{ imageFrom("ghcr.io/akuity/sedemo-monorepo-rollouts-app", warehouse("app")).Tag }}
  promotionTemplate:
    spec:
      steps:
      - task:
          name: vm-render
        as: render
      - uses: git-push
        as: push
        config:
          path: ./out
          targetBranch: rendered/vm-demo/sit
      - task:
