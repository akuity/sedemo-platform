  annotations:
    kargo.akuity.io/color: amber
spec:
  shard: team-ada
  requestedFreight:
  - origin:
      kind: Warehouse
      name: app
    sources:
      stages:
      - qa
  - origin:
      kind: Warehouse
      name: base-image
    sources:
      stages:
      - qa
  verification:
    analysisTemplates:
    - name: vm-health
