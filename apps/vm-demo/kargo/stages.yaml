---
apiVersion: kargo.akuity.io/v1alpha1
kind: Stage
metadata:
  name: uat
  namespace: vm-demo
  annotations:
    kargo.akuity.io/color: orange
spec:
  shard: team-ada
  requestedFreight:
  - origin:
      kind: Warehouse
      name: app
    sources:
      stages:
      - sit
  - origin:
      kind: Warehouse
      name: base-image
    sources:
      stages:
      - sit
  verification:
    analysisTemplates:
    - name: vm-health
    args:
    - name: stage
      value: uat
    - name: expectedCount
      value: "1"
    - name: smoke
      value: "false"
    - name: appVersion
      value: ${{ imageFrom("ghcr.io/akuity/sedemo-monorepo-rollouts-app", warehouse("app")).Tag }}
  promotionTemplate:
    spec:
      steps:
      - task:
          name: vm-render
        as: render
      # The PR diff is exactly what will land on the VM: rollouts-demo.env and the
      # deploy pin (app version, artifact, base template).
      - uses: git-push
        as: pr-push
        if: ${{ outputs.render.changed }}
        config:
          path: ./out
          generateTargetBranch: true
      - uses: git-open-pr
        as: open-pr
        if: ${{ outputs.render.changed }}
        config:
          repoURL: https://github.com/akuity/sedemo-platform
          sourceBranch: ${{ outputs['pr-push'].branch }}
          targetBranch: rendered/vm-demo/uat
          title: "vm-demo uat: ${{ outputs.render.appVersion }} / ${{ outputs.render.baseTemplate }}"
          description: |
            Kargo promotion of Freight `${{ ctx.targetFreight.name }}` to `uat`.

            - app: `${{ outputs.render.appVersion }}`
            - base template: `${{ outputs.render.baseTemplate }}`
            - promotion: https://kargo.akpdemoapps.link/project/${{ ctx.project }}/promotion/${{ ctx.promotion }}

            Merging this PR lets the promotion continue: it then runs
            converge.yml for `uat` against the merge commit.
      - uses: git-wait-for-pr
        as: merged
        if: ${{ outputs.render.changed }}
        config:
          repoURL: https://github.com/akuity/sedemo-platform
          prNumber: ${{ outputs['open-pr'].pr.id }}
      - task:
          name: vm-converge
        vars:
        - name: platformRef
          value: "${{ outputs.render.changed ? outputs.merged?.commit : outputs.render.commit }}"
---
apiVersion: kargo.akuity.io/v1alpha1
kind: Stage
metadata:
  name: prod
  namespace: vm-demo
  annotations:
    kargo.akuity.io/color: red
spec:
  shard: team-ada
  requestedFreight:
  - origin:
      kind: Warehouse
      name: app
    sources:
      stages:
      - uat
  - origin:
      kind: Warehouse
      name: base-image
    sources:
      stages:
      - uat
  verification:
    analysisTemplates:
    - name: vm-health
    args:
    - name: stage
      value: prod
    # Cut order item 2: "1" if prod drops to a single VM.
    - name: expectedCount
      value: "2"
    - name: smoke
      value: "false"
    - name: appVersion
      value: ${{ imageFrom("ghcr.io/akuity/sedemo-monorepo-rollouts-app", warehouse("app")).Tag }}
  promotionTemplate:
    spec:
      steps:
      - task:
          name: vm-render
        as: render
      - uses: git-push
        as: pr-push
        if: ${{ outputs.render.changed }}
        config:
          path: ./out
          generateTargetBranch: true
      - uses: git-open-pr
        as: open-pr
        if: ${{ outputs.render.changed }}
        config:
          repoURL: https://github.com/akuity/sedemo-platform
          sourceBranch: ${{ outputs['pr-push'].branch }}
          targetBranch: rendered/vm-demo/prod
          title: "vm-demo prod: ${{ outputs.render.appVersion }} / ${{ outputs.render.baseTemplate }}"
          description: |
            Kargo promotion of Freight `${{ ctx.targetFreight.name }}` to `prod`.

            - app: `${{ outputs.render.appVersion }}`
            - base template: `${{ outputs.render.baseTemplate }}`
            - promotion: https://kargo.akpdemoapps.link/project/${{ ctx.project }}/promotion/${{ ctx.promotion }}

            Gated by a Jira CHANGE issue. Once the issue is Approved and this
            PR is merged, the promotion runs converge.yml for `prod`
            (one VM at a time) against the merge commit.
      - uses: jira
        as: change
        config:
          credentials:
            sharedSecretName: jira-access-secret
          createIssue:
            projectKey: CHANGE
            issueType: Task
            summary: "vm-demo prod: rollouts-app ${{ outputs.render.appVersion }} on base ${{ outputs.render.baseTemplate }}"
            description: "Rendered change (PR): ${{ outputs['open-pr']?.pr?.url ?? 'none, render identical to rendered/vm-demo/prod' }}. Kargo promotion: https://kargo.akpdemoapps.link/project/${{ ctx.project }}/promotion/${{ ctx.promotion }}. Deploy: converge.yml for prod, rolling vm-prod-1 then vm-prod-2; halts if vm-prod-1 fails its health check. Move to Approved to release."
            labels:
            - vm-demo
      - uses: set-metadata
        config:
          updates:
          - kind: Freight
            name: ${{ ctx.targetFreight.name }}
            values:
              jira-issue-key: ${{ outputs.change.key }}
              pr-url: ${{ outputs['open-pr']?.pr?.url ?? '' }}
      - uses: jira
        as: change-approved
        config:
          credentials:
            sharedSecretName: jira-access-secret
          waitForStatus:
            issueKey: ${{ outputs.change.key }}
            expectedStatus: Approved
      - uses: git-wait-for-pr
        as: merged
        if: ${{ outputs.render.changed }}
        config:
          repoURL: https://github.com/akuity/sedemo-platform
          prNumber: ${{ outputs['open-pr'].pr.id }}
      - task:
          name: vm-converge
        vars:
        - name: platformRef
          value: "${{ outputs.render.changed ? outputs.merged?.commit : outputs.render.commit }}"
      - uses: jira
        config:
          credentials:
            sharedSecretName: jira-access-secret
          commentOnIssue:
            issueKey: ${{ outputs.change.key }}
            body: "Deployed ${{ outputs.render.appVersion }} on base ${{ outputs.render.baseTemplate }} to vm-prod-1, vm-prod-2 (rolling) and verified. Promotion: ${{ ctx.promotion }}."
