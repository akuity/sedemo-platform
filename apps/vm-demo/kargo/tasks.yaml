# PromotionTask: vm-render
#
# Renders exactly what will land on the stage's VMs and commits it to the
# working tree of branch rendered/vm-demo/<stage> (./out). It does NOT push:
# the calling Stage decides between a direct push (dev, qa, sit) and a PR
# (uat, prod).
#
#   ./platform  this repo at main            (env/<stage>/{values,deploy}.yaml)
#   ./out       rendered/vm-demo/<stage>     (output: rollouts-demo.env, deploy.yaml)
#   ./app       sedemo-monorepo @ Freight    (vm-app/config-chart)
#   ./infra     sedemo-vm-infra @ Freight    (images/base.json)
#
# Outputs (via compose-output, read by the Stage as outputs.<task alias>.*):
#   commit    HEAD of ./out after the commit step
#   previous  HEAD of rendered/vm-demo/<stage> before this promotion
#   changed   false when the render is identical to what is already on the
#             branch (re-promoting the same Freight: autoRollback, retries).
#             git-commit is a no-op then; PR stages skip the PR and converge
#             the existing head.
#   appVersion, baseTemplate, appRevision, chartCommit, infraCommit
#             what this promotion deploys (tag, template, source commits)
#   prevAppVersion, prevBaseTemplate, prevAppRevision, prevChartCommit,
#   prevInfraCommit
#             what the stage ran before, from its last deploy pin ('' when
#             unknown); used for the release diff in the prod change ticket
apiVersion: kargo.akuity.io/v1alpha1
kind: PromotionTask
metadata:
  name: vm-render
  namespace: vm-demo
spec:
  vars:
  - name: stage
    value: ${{ ctx.stage }}
  - name: platformRepo
    value: https://github.com/akuity/sedemo-platform
  - name: appRepo
    value: https://github.com/akuity/sedemo-monorepo
  - name: infraRepo
    value: https://github.com/akuity/sedemo-vm-infra
  - name: artifactRepo
    value: ghcr.io/akuity/sedemo-monorepo-rollouts-app
  steps:
  - uses: git-clone
    config:
      repoURL: ${{ vars.platformRepo }}
      checkout:
      - branch: main
        path: ./platform
  - uses: git-clone
    as: clone-out
    config:
      repoURL: ${{ vars.platformRepo }}
      checkout:
      - branch: rendered/vm-demo/${{ vars.stage }}
        create: true
        path: ./out
        as: out
  - uses: git-clone
    config:
      repoURL: ${{ vars.appRepo }}
      checkout:
      - commit: ${{ commitFrom(vars.appRepo, warehouse("app")).ID }}
        path: ./app
  - uses: git-clone
    config:
      repoURL: ${{ vars.infraRepo }}
      checkout:
      - commit: ${{ commitFrom(vars.infraRepo, warehouse("base-image")).ID }}
        path: ./infra
  # What this stage runs now, read from the last rendered deploy pin before it
  # is replaced. Used for the release diff in the prod change ticket. A brand
  # new stage has no deploy.yaml yet, so this step may fail harmlessly.
  - uses: yaml-parse
    as: prev
    continueOnError: true
    config:
      path: ./out/deploy.yaml
      outputs:
      - name: appVersion
        fromExpression: app_version ?? ''
      - name: baseTemplate
        fromExpression: base_template ?? ''
      - name: appRevision
        fromExpression: app_revision ?? ''
      - name: chartCommit
        fromExpression: chart_commit ?? ''
      - name: infraCommit
        fromExpression: infra_commit ?? ''
  - uses: git-clear
    config:
      path: ./out
  # base.json is JSON, which is valid YAML, so yaml-parse reads it.
  - uses: yaml-parse
    as: base
    config:
      path: ./infra/images/base.json
      outputs:
      - name: template
        fromExpression: template
      - name: vmid
        fromExpression: vmid
  # images/base.json is a placeholder ({}) until the first bake; refuse that
  # Freight instead of rendering a deploy pin with no template.
  - uses: fail
    if: ${{ (task.outputs.base.template ?? '') == '' }}
    config:
      message: >-
        images/base.json at this base-image Freight has no template (not yet
        baked). Promote a Freight from a baked commit.
  # Audit: who asked for this promotion (human input #1). Auto-promotions and
  # auto-rollbacks have no human actor and are recorded as Kargo (automatic).
  - uses: record-audit-event
    as: audit-requested
    retry:
      errorThreshold: 3
    config:
      type: promotion-requested
      message: >-
        ${{ (ctx.meta.promotion.actor ?? '') != '' ? ctx.meta.promotion.actor : 'Kargo (automatic)' }}
        promoted rollouts-app ${{ imageFrom(vars.artifactRepo, warehouse('app')).Tag }}
        on base ${{ task.outputs.base.template }} to ${{ vars.stage }}
      data:
        stage: ${{ vars.stage }}
        freight: ${{ ctx.targetFreight.name }}
        appVersion: ${{ imageFrom(vars.artifactRepo, warehouse('app')).Tag }}
        baseTemplate: ${{ task.outputs.base.template }}
  # Render-time gate: the chart marks its keys `required`, so a missing value
  # (e.g. `namespace` in env/<stage>/values.yaml) fails here, before any VM
  # is touched. color is the tag suffix after the first '-' (50-blue: blue),
  # semver the whole tag.
  #
  # The chart renders a systemd EnvironmentFile, not Kubernetes YAML.
  # helm-template treats outPath as a single file only when it ends in
  # .yaml/.yml (anything else is a directory), so render to a scratch .yaml
  # outside ./out and copy it to rollouts-demo.env. Helm's leading `---` and
  # `# Source:` lines stay; systemd ignores them.
  - uses: helm-template
    config:
      releaseName: rollouts-demo
      path: ./app/vm-app/config-chart
      valuesFiles:
      - ./platform/apps/vm-demo/env/${{ vars.stage }}/values.yaml
      setValues:
      - key: color
        value: ${{ split(imageFrom(vars.artifactRepo, warehouse("app")).Tag, "-", 2)[1] }}
      - key: semver
        value: ${{ imageFrom(vars.artifactRepo, warehouse("app")).Tag }}
      - key: stage
        value: ${{ vars.stage }}
      outPath: ./render/rollouts-demo.yaml
  - uses: copy
    config:
      inPath: ./render/rollouts-demo.yaml
      outPath: ./out/rollouts-demo.env
  - uses: copy
    config:
      inPath: ./platform/apps/vm-demo/env/${{ vars.stage }}/deploy.yaml
      outPath: ./out/deploy.yaml
  # The base image's package manifest, so the rendered-config PR shows OS
  # package changes for base-image promotions (same content as the change
  # ticket's package diff).
  - uses: copy
    config:
      inPath: ./infra/images/packages.txt
      outPath: ./out/packages.txt
  - uses: yaml-update
    config:
      path: ./out/deploy.yaml
      updates:
      - key: app_version
        value: ${{ imageFrom(vars.artifactRepo, warehouse("app")).Tag }}
      - key: artifact
        value: ${{ vars.artifactRepo }}:${{ imageFrom(vars.artifactRepo, warehouse("app")).Tag }}
      - key: base_template
        value: ${{ task.outputs.base.template }}
      - key: base_vmid
        value: ${{ task.outputs.base.vmid }}
      - key: freight
        value: ${{ ctx.targetFreight.name }}
      # Exact sources, so the deploy pin (and the PR diff) shows which commits
      # changed: the app image's source revision, the config chart commit,
      # and the infra commit that recorded the base image.
      - key: app_revision
        value: ${{ imageFrom(vars.artifactRepo, warehouse("app")).Annotations['org.opencontainers.image.revision'] ?? '' }}
      - key: chart_commit
        value: ${{ commitFrom(vars.appRepo, warehouse("app")).ID }}
      - key: infra_commit
        value: ${{ commitFrom(vars.infraRepo, warehouse("base-image")).ID }}
  # Skipped (no new commit) when nothing changed; its output is then the
  # existing HEAD.
  - uses: git-commit
    as: commit
    config:
      path: ./out
      message: "vm-demo: ${{ vars.stage }} app ${{ imageFrom(vars.artifactRepo, warehouse('app')).Tag }} base ${{ task.outputs.base.template }}"
  - uses: compose-output
    as: output
    config:
      commit: ${{ task.outputs.commit.commit }}
      previous: ${{ task.outputs['clone-out'].commits.out }}
      changed: ${{ task.outputs.commit.commit != task.outputs['clone-out'].commits.out }}
      appVersion: ${{ imageFrom(vars.artifactRepo, warehouse("app")).Tag }}
      baseTemplate: ${{ task.outputs.base.template }}
      appRevision: ${{ imageFrom(vars.artifactRepo, warehouse("app")).Annotations['org.opencontainers.image.revision'] ?? '' }}
      chartCommit: ${{ commitFrom(vars.appRepo, warehouse("app")).ID }}
      infraCommit: ${{ commitFrom(vars.infraRepo, warehouse("base-image")).ID }}
      prevAppVersion: ${{ task.outputs.prev?.appVersion ?? '' }}
      prevBaseTemplate: ${{ task.outputs.prev?.baseTemplate ?? '' }}
      prevAppRevision: ${{ task.outputs.prev?.appRevision ?? '' }}
      prevChartCommit: ${{ task.outputs.prev?.chartCommit ?? '' }}
      prevInfraCommit: ${{ task.outputs.prev?.infraCommit ?? '' }}
---
# PromotionTask: vm-converge
#
# Dispatches converge.yml in the private infra repo with the stage and the
# rendered commit, then waits for it. converge.yml checks out that commit,
# runs Terraform (VM lifecycle) and Ansible (app deploy), and serializes per
# stage. It always runs, even when the render was a no-op, so re-promoting
# known-good Freight re-converges the VMs.
apiVersion: kargo.akuity.io/v1alpha1
kind: PromotionTask
metadata:
  name: vm-converge
  namespace: vm-demo
spec:
  vars:
  - name: stage
    value: ${{ ctx.stage }}
  - name: platformRef
  # "<app tag> on <base template>", for the deployed audit event.
  - name: release
    value: ""
  - name: infraRepo
    value: https://github.com/akuity/sedemo-vm-infra
  # The stage's VMIDs, mirroring terraform/stage-vms locals.vms in the infra
  # repo; used to look up each VM's current (DHCP) address after converge.
  - name: vmid1
    value: "${{ {'dev': '7101', 'qa': '7102', 'sit': '7103', 'uat': '7104', 'prod': '7105'}[ctx.stage] }}"
  - name: vmid2
    value: "${{ ctx.stage == 'prod' ? '7106' : '' }}"
  steps:
  - uses: gha-dispatch-workflow
    as: dispatch
    config:
      repoURL: ${{ vars.infraRepo }}
      workflowFile: converge.yml
      ref: main
      inputs:
        stage: ${{ vars.stage }}
        platform_ref: ${{ vars.platformRef }}
      # Seconds to wait for the run to be created (max 300).
      timeout: 120
  # A base-image promotion replaces the stage's VMs (prod: two, one at a
  # time), so allow well past the 15m a single replacement needs.
  - uses: gha-wait-for-workflow
    retry:
      timeout: 30m
    config:
      repoURL: ${{ vars.infraRepo }}
      runID: ${{ task.outputs.dispatch.runID }}
      expectedConclusion: success
      pollInterval: 5s
  # App links: each VM's current address from the Proxmox guest agent
  # (read-only token), so the promotion, the deployed audit event and the
  # prod change ticket say where to look. DHCP addresses change when a
  # base-image promotion replaces VMs.
  - uses: http
    as: vm1
    retry:
      errorThreshold: 3
    config:
      url: ${{ secret('vm-demo-proxmox-verify').PROXMOX_URL }}/api2/json/nodes/pve01/qemu/${{ vars.vmid1 }}/agent/network-get-interfaces
      insecureSkipTLSVerify: true
      headers:
      - name: Authorization
        value: PVEAPIToken=${{ secret('vm-demo-proxmox-verify').TOKEN_ID }}=${{ secret('vm-demo-proxmox-verify').TOKEN_SECRET }}
      successExpression: response.status == 200
      outputs:
      - name: url
        fromExpression: "'http://' + ((first(filter(flatten(map(filter(response.body.data.result, #.name != 'lo'), #['ip-addresses'] ?? [])), #['ip-address-type'] == 'ipv4' && !hasPrefix(#['ip-address'], '169.254.'))) ?? {})['ip-address'] ?? 'unknown') + ':8080/'"
  - uses: http
    as: vm2
    if: ${{ vars.vmid2 != '' }}
    retry:
      errorThreshold: 3
    config:
      url: ${{ secret('vm-demo-proxmox-verify').PROXMOX_URL }}/api2/json/nodes/pve01/qemu/${{ vars.vmid2 }}/agent/network-get-interfaces
      insecureSkipTLSVerify: true
      headers:
      - name: Authorization
        value: PVEAPIToken=${{ secret('vm-demo-proxmox-verify').TOKEN_ID }}=${{ secret('vm-demo-proxmox-verify').TOKEN_SECRET }}
      successExpression: response.status == 200
      outputs:
      - name: url
        fromExpression: "'http://' + ((first(filter(flatten(map(filter(response.body.data.result, #.name != 'lo'), #['ip-addresses'] ?? [])), #['ip-address-type'] == 'ipv4' && !hasPrefix(#['ip-address'], '169.254.'))) ?? {})['ip-address'] ?? 'unknown') + ':8080/'"
  - uses: compose-output
    as: links
    config:
      appLinks: "${{ task.outputs.vm1.url + (vars.vmid2 != '' ? ' ' + task.outputs.vm2.url : '') }}"
  # Audit: the outcome that closes this promotion's chain of custody.
  - uses: record-audit-event
    as: audit-deployed
    retry:
      errorThreshold: 3
    config:
      type: deployed
      message: "${{ vars.release }} deployed to ${{ vars.stage }} and converged: ${{ task.outputs.links.appLinks }}"
      data:
        stage: ${{ vars.stage }}
        appLinks: ${{ task.outputs.links.appLinks }}
        renderedCommit: ${{ vars.platformRef }}
        convergeRun: https://github.com/akuity/sedemo-vm-infra/actions/runs/${{ task.outputs.dispatch.runID }}
