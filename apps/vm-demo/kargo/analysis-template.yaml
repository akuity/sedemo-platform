# vm-health: post-promotion verification for every vm-demo Stage.
#
# Runs as an Argo Rollouts Job on the homelab shard's cluster, which can reach
# the Proxmox API and the VMs. The script discovers the stage's VMs by Proxmox
# tag (stage-<stage>) and guest-agent IPv4, retrying up to 5 minutes for VMs
# that were just created or replaced, then checks /healthz on each (plus the
# promoted /version, and for qa a smoke check). It fails, never passes
# vacuously, when fewer than expectedCount VMs are found. On dev a failure
# triggers autoRollback (ProjectConfig).
#
# The inline script is a copy of verify.sh (the tested source);
# tests/verify_test.sh asserts the two are identical.
#
# Secret vm-demo-proxmox-verify (keys PROXMOX_URL, TOKEN_ID, TOKEN_SECRET; a
# read-only Proxmox API token) is created out-of-band in the namespace where
# these Jobs run. It is never committed.
apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: vm-health
  namespace: vm-demo
spec:
  args:
  - name: stage
  - name: expectedCount
  - name: smoke
    value: "false"
  # Promoted nav-service version; /version must report it. Empty skips.
  - name: appVersion
    value: ""
  metrics:
  - name: vm-health
    count: 1
    failureLimit: 0
    provider:
      job:
        spec:
          backoffLimit: 0
          # 5 min discovery window plus checks and package install.
          activeDeadlineSeconds: 600
          template:
            spec:
              restartPolicy: Never
              containers:
              - name: verify
                image: alpine:3.20
                env:
                - name: STAGE
                  value: "{{args.stage}}"
                - name: EXPECTED_COUNT
                  value: "{{args.expectedCount}}"
                - name: SMOKE
                  value: "{{args.smoke}}"
                - name: APP_VERSION
                  value: "{{args.appVersion}}"
                - name: PROXMOX_URL
                  valueFrom:
                    secretKeyRef:
                      name: vm-demo-proxmox-verify
                      key: PROXMOX_URL
                - name: TOKEN_ID
                  valueFrom:
                    secretKeyRef:
                      name: vm-demo-proxmox-verify
                      key: TOKEN_ID
                - name: TOKEN_SECRET
                  valueFrom:
                    secretKeyRef:
                      name: vm-demo-proxmox-verify
                      key: TOKEN_SECRET
                command:
                - /bin/sh
                - -c
                args:
                - |
                  #!/bin/sh
                  # vm-health verification for the vm-demo Kargo project.
                  #
                  # This file is the tested source. analysis-template.yaml carries an inline
                  # copy (tests/verify_test.sh asserts they are identical), so edit here and
                  # paste it there.
                  #
                  # Discovers the stage's VMs through the Proxmox API (tag stage-<stage>,
                  # templates excluded), reads each VM's IPv4 from the QEMU guest agent, then
                  # checks the app on every VM. Exits non-zero, naming the VM and the reason,
                  # when fewer than EXPECTED_COUNT VMs report an IP within DISCOVERY_TIMEOUT
                  # or any check fails. Never passes with zero VMs.
                  #
                  # Required env: PROXMOX_URL (https://host:8006), TOKEN_ID (user@realm!name),
                  #   TOKEN_SECRET, STAGE, EXPECTED_COUNT.
                  # Optional env: SMOKE (true: also check "/" shows NAV and /version stage),
                  #   APP_VERSION (non-empty: /version must report it), APP_PORT (8080),
                  #   DISCOVERY_TIMEOUT (300s), DISCOVERY_INTERVAL (10s), HTTP_ATTEMPTS (3),
                  #   HTTP_INTERVAL (5s).
                  set -u

                  : "${PROXMOX_URL:?PROXMOX_URL is required}"
                  : "${TOKEN_ID:?TOKEN_ID is required}"
                  : "${TOKEN_SECRET:?TOKEN_SECRET is required}"
                  : "${STAGE:?STAGE is required}"
                  : "${EXPECTED_COUNT:?EXPECTED_COUNT is required}"
                  SMOKE="${SMOKE:-false}"
                  APP_VERSION="${APP_VERSION:-}"
                  APP_PORT="${APP_PORT:-8080}"
                  DISCOVERY_TIMEOUT="${DISCOVERY_TIMEOUT:-300}"
                  DISCOVERY_INTERVAL="${DISCOVERY_INTERVAL:-10}"
                  HTTP_ATTEMPTS="${HTTP_ATTEMPTS:-3}"
                  HTTP_INTERVAL="${HTTP_INTERVAL:-5}"

                  if ! command -v curl >/dev/null 2>&1 || ! command -v jq >/dev/null 2>&1; then
                    apk add --no-cache -q curl jq >/dev/null || {
                      echo "FAIL: curl and jq are required and could not be installed"
                      exit 1
                    }
                  fi

                  tmp="$(mktemp -d)"
                  trap 'rm -rf "$tmp"' EXIT

                  # api <path>: GET a Proxmox API path; prints the JSON body. The homelab
                  # Proxmox API uses a self-signed certificate, hence -k.
                  api() {
                    curl -fsS -k --max-time 10 \
                      -H "Authorization: PVEAPIToken=${TOKEN_ID}=${TOKEN_SECRET}" \
                      "${PROXMOX_URL%/}/api2/json$1"
                  }

                  # list_vms: "node vmid name" for every non-template VM tagged stage-<stage>.
                  list_vms() {
                    api "/cluster/resources?type=vm" | jq -r --arg tag "stage-$STAGE" '
                      .data[]
                      | select((.template // 0) != 1)
                      | select([(.tags // "") | splits("[;, ]+")] | index($tag))
                      | "\(.node) \(.vmid) \(.name)"'
                  }

                  # vm_ip <node> <vmid>: first IPv4 the guest agent reports on an interface
                  # other than loopback ("lo"), skipping link-local. Prints nothing while the
                  # agent is not up yet.
                  vm_ip() {
                    api "/nodes/$1/qemu/$2/agent/network-get-interfaces" 2>/dev/null | jq -r '
                      [ .data.result[]?
                        | select(.name != "lo")
                        | ."ip-addresses"[]?
                        | select(."ip-address-type" == "ipv4")
                        | ."ip-address"
                        | select(startswith("169.254.") | not) ]
                      | first // empty' 2>/dev/null
                  }

                  # ---- discovery: wait until EXPECTED_COUNT VMs report an IP ----------------
                  deadline=$(( $(date +%s) + DISCOVERY_TIMEOUT ))
                  while :; do
                    found=0
                    pending=""
                    api_error=""
                    : > "$tmp/targets"
                    if ! vms="$(list_vms 2>"$tmp/api.err")"; then
                      api_error="Proxmox API query failed: $(cat "$tmp/api.err")"
                      vms=""
                    fi
                    while read -r node vmid name; do
                      [ -n "$vmid" ] || continue
                      ip="$(vm_ip "$node" "$vmid")"
                      if [ -n "$ip" ]; then
                        echo "$name $ip" >> "$tmp/targets"
                        found=$((found + 1))
                      else
                        pending="$pending $name(vmid $vmid)"
                      fi
                    done <<EOF
                  $vms
                  EOF
                    if [ "$found" -ge "$EXPECTED_COUNT" ]; then
                      break
                    fi
                    if [ "$(date +%s)" -ge "$deadline" ]; then
                      echo "FAIL: found $found of $EXPECTED_COUNT VMs tagged stage-$STAGE with a guest-agent IPv4 after ${DISCOVERY_TIMEOUT}s"
                      [ -z "$pending" ] || echo "  no IP reported by:$pending"
                      [ -z "$api_error" ] || echo "  $api_error"
                      exit 1
                    fi
                    echo "waiting: found $found of $EXPECTED_COUNT VMs for stage $STAGE${pending:+ (no IP yet:$pending)}"
                    sleep "$DISCOVERY_INTERVAL"
                  done

                  # ---- checks ---------------------------------------------------------------

                  # fetch <url> <outfile>: GET with retries; succeeds on HTTP 200. Leaves the
                  # last status code in $code and the body in <outfile>.
                  fetch() {
                    attempt=1
                    while :; do
                      code="$(curl -sS --max-time 5 -o "$2" -w '%{http_code}' "$1" 2>"$tmp/curl.err")" || code="000"
                      [ "$code" = "200" ] && return 0
                      [ "$attempt" -ge "$HTTP_ATTEMPTS" ] && break
                      attempt=$((attempt + 1))
                      sleep "$HTTP_INTERVAL"
                    done
                    [ "$code" != "000" ] || cat "$tmp/curl.err" > "$2"
                    return 1
                  }

                  failures=0
                  fail_vm() {
                    echo "FAIL $1: $2"
                    failures=$((failures + 1))
                  }

                  while read -r name ip; do
                    base="http://$ip:$APP_PORT"
                    if ! fetch "$base/healthz" "$tmp/healthz"; then
                      fail_vm "$name ($ip)" "/healthz returned $code: $(head -c 300 "$tmp/healthz")"
                      continue
                    fi
                    version="" ; vstage=""
                    if [ -n "$APP_VERSION" ] || [ "$SMOKE" = "true" ]; then
                      if ! fetch "$base/version" "$tmp/version"; then
                        fail_vm "$name ($ip)" "/version returned $code"
                        continue
                      fi
                      version="$(jq -r '.version // ""' "$tmp/version" 2>/dev/null)"
                      vstage="$(jq -r '.stage // ""' "$tmp/version" 2>/dev/null)"
                    fi
                    if [ -n "$APP_VERSION" ] && [ "$version" != "$APP_VERSION" ]; then
                      fail_vm "$name ($ip)" "/version reports version '$version', expected promoted $APP_VERSION"
                      continue
                    fi
                    if [ "$SMOKE" = "true" ]; then
                      if [ "$vstage" != "$STAGE" ]; then
                        fail_vm "$name ($ip)" "/version reports stage '$vstage', expected $STAGE"
                        continue
                      fi
                      if ! fetch "$base/" "$tmp/index"; then
                        fail_vm "$name ($ip)" "/ returned $code"
                        continue
                      fi
                      if ! grep -q "NAV" "$tmp/index"; then
                        fail_vm "$name ($ip)" "/ page does not contain NAV"
                        continue
                      fi
                    fi
                    smoked=""
                    [ "$SMOKE" != "true" ] || smoked=", smoke ok"
                    echo "ok $name ($ip): healthz 200${version:+, version $version}$smoked"
                  done < "$tmp/targets"

                  if [ "$failures" -gt 0 ]; then
                    echo "FAIL: $failures VM(s) failed verification for stage $STAGE"
                    exit 1
                  fi
                  echo "PASS: $found VM(s) healthy for stage $STAGE"
