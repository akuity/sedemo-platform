# Two Warehouses, so app/config changes and base-image changes become
# separate Freight and can be promoted independently. Every Stage requests
# Freight from both.
#
# app: the existing rollouts-app image (tags like 50-blue; the suffix is the
# color the app paints) plus the config chart that renders the app's
# systemd EnvironmentFile. The image is FROM scratch; converge extracts its
# binary and assets and runs them natively on the VM. The demo promotes
# already-published tags only.
apiVersion: kargo.akuity.io/v1alpha1
kind: Warehouse
metadata:
  name: app
  namespace: vm-demo
spec:
  interval: 5m0s
  subscriptions:
  - image:
      repoURL: ghcr.io/akuity/sedemo-monorepo-rollouts-app
      imageSelectionStrategy: NewestBuild
      allowTagsRegexes:
      - ^\d+-[a-z]+$
      discoveryLimit: 10
  - git:
      repoURL: https://github.com/akuity/sedemo-monorepo
      includePaths:
      - vm-app/config-chart
---
# base-image: the Packer-baked VM template, recorded by the bake workflow in
# images/base.json ({template, vmid, built, packer_commit}).
apiVersion: kargo.akuity.io/v1alpha1
kind: Warehouse
metadata:
  name: base-image
  namespace: vm-demo
spec:
  interval: 5m0s
  subscriptions:
  - git:
      repoURL: https://github.com/akuity/sedemo-vm-infra
      includePaths:
      - images
