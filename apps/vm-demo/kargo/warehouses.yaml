# Two Warehouses, so app/config changes and base-image changes become
# separate Freight and can be promoted independently. Every Stage requests
# Freight from both.
#
# nav-service: the application artifact (an ORAS-pushed tarball holding the
# binary and its systemd unit, plain semver tags) plus the config chart that
# renders /etc/nav-service/config.yaml.
apiVersion: kargo.akuity.io/v1alpha1
kind: Warehouse
metadata:
  name: nav-service
  namespace: vm-demo
spec:
  interval: 5m0s
  subscriptions:
  - image:
      repoURL: ghcr.io/akuity/sedemo-monorepo-nav-service
      imageSelectionStrategy: SemVer
      discoveryLimit: 10
  - git:
      repoURL: https://github.com/akuity/sedemo-monorepo
      includePaths:
      - vm-app/config-chart
---
# base-image: the Packer-baked VM template, recorded by the bake workflow in
# images/base.json ({template, vmid, built, packer_commit}).
apiVersion: kargo.akuity.io/v1alpha1
kind: Warehouse
metadata:
  name: base-image
  namespace: vm-demo
spec:
  interval: 5m0s
  subscriptions:
  - git:
      repoURL: https://github.com/akuity/sedemo-vm-infra
      includePaths:
      - images
