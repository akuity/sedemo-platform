replicaCount: 1

image:
  repository: ghcr.io/akuity/sedemo-monorepo-rollouts-app
  tag: latest
  pullPolicy: IfNotPresent

# Per-env overrides live in env/<stage>/config.yaml.
# App is served at <hostPrefix>.<rootDomain>, schema viewer at
# <hostPrefix>-schema.<rootDomain>.
hostPrefix: dbr-dev
ingress:
  rootDomain: akpdemoapps.link

# When set (e.g. "blue"), overrides the color the app UI displays, which is
# otherwise baked into the image tag. The preview beat changes this in a PR.
colorOverride: ""

db:
  name: appdb
  user: app
  # Demo-only credential; matches secrets/flyway-db-secret.yaml.
  password: kargodemo1

# Gates the whole of templates/postgres.yaml (Secret, Deployment, Service).
# Default true; env/<stage>/config.yaml sets it false to park a stage with no
# database at all. Nothing outside postgres.yaml and pgweb.yaml consumes
# db-credentials, so disabling this leaves no dangling reference.
postgres:
  enabled: true

pgweb:
  enabled: true

loadgen:
  enabled: true
