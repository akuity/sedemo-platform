replicaCount: 1

image:
  repository: ghcr.io/akuity/sedemo-monorepo-rollouts-app
  tag: latest
  pullPolicy: IfNotPresent

# Per-env overrides live in env/<stage>/config.yaml.
# App is served at <hostPrefix>.<rootDomain>. There is no schema viewer
# Ingress; browse the db with psql via kubectl exec (see README).
hostPrefix: dbr-dev
ingress:
  rootDomain: akpdemoapps.link

# When set (e.g. "blue"), overrides the color the app UI displays, which is
# otherwise baked into the image tag. The preview beat changes this in a PR.
colorOverride: ""

db:
  name: appdb
  # AWS Secrets Manager key. Properties: username/password (the non-superuser
  # app role, shared with the flyway-migrate step via
  # secrets/flyway-db-secret.yaml) and admin_password (bootstrap superuser,
  # this chart only). Never put credentials in values: this repo is public.
  secretKey: kargo-flyway-db
  # Namespaces whose pods may reach Postgres (NetworkPolicy). The Kargo agent
  # on sedemo-primary runs promotion step pods, including flyway-migrate.
  allowedClientNamespaces:
  - akuity

# Gates the whole of templates/postgres.yaml (ExternalSecret, ConfigMap,
# NetworkPolicy, Deployment, Service).
# Default true; env/<stage>/config.yaml sets it false to park a stage with no
# database at all. Nothing outside postgres.yaml consumes
# db-credentials, so disabling this leaves no dangling reference.
postgres:
  enabled: true

loadgen:
  enabled: true
