# One Application per kustomize overlay under stages/ -- today that is only
# staging. The prod-<x> shards are created dynamically from
# infra/shards.auto.tfvars, so they have no overlay directory here: their
# Applications are generated into argocd/shard-apps.yaml by the `shards`
# promotion, and their overlay is built in the promotion workspace by the
# render-pr PromotionTask.
#
# The rendered branches don't exist until a Stage's first promotion, so until
# then each Application reports a missing revision.
#
# No syncPolicy.automated: Kargo's argocd-update step drives every sync.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: team-namho
  namespace: argocd
spec:
  generators:
  - git:
      repoURL: https://github.com/akuity/sedemo-platform
      revision: HEAD
      directories:
      - path: apps/team-namho/stages/*
  template:
    metadata:
      name: team-namho-{{path.basename}}
      annotations:
        kargo.akuity.io/authorized-stage: team-namho:{{path.basename}}
    spec:
      project: team-namho
      source:
        repoURL: https://github.com/akuity/sedemo-platform
        targetRevision: rendered/team-namho/{{path.basename}}
        path: .
      destination:
        name: sedemo-primary
        namespace: team-namho-{{path.basename}}
      syncPolicy:
        syncOptions:
        - CreateNamespace=true
