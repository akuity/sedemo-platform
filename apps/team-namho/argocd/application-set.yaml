# One Application per kustomize overlay under stages/: dev, staging, prod and
# the three prod-<region> targets. Adding a Stage is two steps -- a Stage in
# kargo/stages.yaml and an overlay directory here; this generator picks up
# the rest.
#
# The rendered branches don't exist until a Stage's first promotion, so until
# then each Application reports a missing revision.
#
# No syncPolicy.automated: Kargo's argocd-update step drives every sync.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: team-namho
  namespace: argocd
spec:
  generators:
  - git:
      repoURL: https://github.com/akuity/sedemo-platform
      revision: HEAD
      directories:
      - path: apps/team-namho/stages/*
  template:
    metadata:
      name: team-namho-{{path.basename}}
      annotations:
        kargo.akuity.io/authorized-stage: team-namho:{{path.basename}}
    spec:
      project: team-namho
      source:
        repoURL: https://github.com/akuity/sedemo-platform
        targetRevision: rendered/team-namho/{{path.basename}}
        path: .
      destination:
        name: sedemo-primary
        namespace: team-namho-{{path.basename}}
      syncPolicy:
        syncOptions:
        - CreateNamespace=true
