apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
- ../../base

patches:
# Per-stage env for the Deployment. Committed, not generated.
- path: release-message.yaml
- target:
    kind: Ingress
    name: smol
  patch: |-
    - op: replace
      path: /spec/tls/0/hosts/0
      value: smol-prod-c.akpdemoapps.link
    - op: replace
      path: /spec/rules/0/host
      value: smol-prod-c.akpdemoapps.link
- target:
    kind: Deployment
    name: smol
  patch: |-
    - op: replace
      path: /spec/replicas
      value: 2
