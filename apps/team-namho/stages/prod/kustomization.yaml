apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
- ../../base

patches:
- target:
    kind: Ingress
    name: smol
  patch: |-
    - op: replace
      path: /spec/tls/0/hosts/0
      value: smol-prod.akpdemoapps.link
    - op: replace
      path: /spec/rules/0/host
      value: smol-prod.akpdemoapps.link
- target:
    kind: Deployment
    name: smol
  patch: |-
    - op: replace
      path: /spec/replicas
      value: 2
