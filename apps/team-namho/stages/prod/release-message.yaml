# Per-stage env for smol. Plain committed YAML -- change it here and promote.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: smol
spec:
  template:
    spec:
      containers:
      - name: smol
        env:
        - name: SMOL_MESSAGE
          value: prod
        - name: SMOL_STAGE
          value: prod
