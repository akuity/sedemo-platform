# Rendered-manifest promotion.
#
# `render` pushes straight to the stage's rendered branch (staging).
# `render-pr` renders the same way but opens a PR against the rendered branch
# and waits for a human to merge it (prod).
#
# yaml-language-server: $schema=https://raw.githubusercontent.com/akuity/kargo/refs/heads/main/ui/src/gen/schema/promotiontasks.kargo.akuity.io_v1alpha1.json
apiVersion: kargo.akuity.io/v1alpha1
kind: PromotionTask
metadata:
  name: render
  namespace: team-namho
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  vars:
  - name: gitRepo
    value: https://github.com/akuity/sedemo-platform
  - name: image
    value: ghcr.io/nk-87/smol
  steps:
  - uses: git-clone
    config:
      repoURL: ${{ vars.gitRepo }}
      checkout:
      - branch: main
        path: ./src
      - branch: rendered/team-namho/${{ ctx.stage }}
        create: true
        path: ./out
  - uses: git-clear
    config:
      path: ./out
  - uses: kustomize-set-image
    as: set-image
    config:
      path: ./src/apps/team-namho/stages/${{ ctx.stage }}
      images:
      - image: ${{ vars.image }}
        tag: ${{ imageFrom(vars.image).Tag }}
  - uses: kustomize-build
    config:
      path: ./src/apps/team-namho/stages/${{ ctx.stage }}
      outPath: ./out/manifests.yaml
  - uses: git-commit
    as: commit
    config:
      path: ./out
      message: |
        team-namho/${{ ctx.stage }}: ${{ task.outputs['set-image'].commitMessage }}
  - uses: git-push
    config:
      path: ./out
      targetBranch: rendered/team-namho/${{ ctx.stage }}
  - uses: argocd-update
    config:
      apps:
      - name: team-namho-${{ ctx.stage }}
        sources:
        - repoURL: ${{ vars.gitRepo }}
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/akuity/kargo/refs/heads/main/ui/src/gen/schema/promotiontasks.kargo.akuity.io_v1alpha1.json
apiVersion: kargo.akuity.io/v1alpha1
kind: PromotionTask
metadata:
  name: render-pr
  namespace: team-namho
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  vars:
  - name: gitRepo
    value: https://github.com/akuity/sedemo-platform
  - name: image
    value: ghcr.io/nk-87/smol
  steps:
  - uses: git-clone
    config:
      repoURL: ${{ vars.gitRepo }}
      checkout:
      - branch: main
        path: ./src
      - branch: rendered/team-namho/${{ ctx.stage }}
        create: true
        path: ./out
  - uses: git-clear
    config:
      path: ./out
  - uses: kustomize-set-image
    as: set-image
    config:
      path: ./src/apps/team-namho/stages/${{ ctx.stage }}
      images:
      - image: ${{ vars.image }}
        tag: ${{ imageFrom(vars.image).Tag }}
  - uses: kustomize-build
    config:
      path: ./src/apps/team-namho/stages/${{ ctx.stage }}
      outPath: ./out/manifests.yaml
  - uses: git-commit
    as: commit
    config:
      path: ./out
      message: |
        team-namho/${{ ctx.stage }}: ${{ task.outputs['set-image'].commitMessage }}
  # A generated branch off rendered/team-namho/prod, so the PR diff is just
  # this promotion's manifest change.
  - uses: git-push
    as: push
    config:
      path: ./out
      generateTargetBranch: true
  - uses: git-open-pr
    as: open-pr
    config:
      repoURL: ${{ vars.gitRepo }}
      sourceBranch: ${{ task.outputs.push.branch }}
      targetBranch: rendered/team-namho/${{ ctx.stage }}
      title: "team-namho/${{ ctx.stage }}: smol ${{ imageFrom(vars.image).Tag }}"
      description: |-
        Rendered manifests for **${{ ctx.stage }}**.

        - **Image:** `${{ vars.image }}:${{ imageFrom(vars.image).Tag }}`
        - **Freight:** ${{ ctx.targetFreight.alias }}
        - **Promotion:** ${{ ctx.promotion }}

        Merging this PR releases to prod. Argo CD syncs once it lands.
  # The promotion parks here until a human merges. This is the prod gate.
  - uses: git-wait-for-pr
    as: wait-for-pr
    config:
      repoURL: ${{ vars.gitRepo }}
      prNumber: ${{ task.outputs['open-pr'].pr.id }}
  - uses: argocd-update
    config:
      apps:
      - name: team-namho-${{ ctx.stage }}
        sources:
        - repoURL: ${{ vars.gitRepo }}
