# yaml-language-server: $schema=https://raw.githubusercontent.com/akuity/kargo/refs/heads/main/ui/src/gen/schema/projects.kargo.akuity.io_v1alpha1.json
apiVersion: kargo.akuity.io/v1alpha1
kind: Project
metadata:
  name: team-namho
  annotations:
    argocd.argoproj.io/sync-wave: "1"
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/akuity/kargo/refs/heads/main/ui/src/gen/schema/projectconfigs.kargo.akuity.io_v1alpha1.json
apiVersion: kargo.akuity.io/v1alpha1
kind: ProjectConfig
metadata:
  name: team-namho
  namespace: team-namho
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  stageLinks:
  - title: smol
    description: The smol instance running at this stage
    url: 'https://smol-{{ .stage.metadata.name }}.akpdemoapps.link/'
  - title: Built from
    description: The git SHA baked into the running image at build time
    url: 'https://smol-{{ .stage.metadata.name }}.akpdemoapps.link/sha/'

  promotionPolicies:
  # Every new image lands in dev unattended. If the smoke check fails, Kargo
  # re-promotes the last good Freight by itself -- onVerification defaults to
  # [Failed], spelled out here so the demo can point at it.
  - stageSelector:
      name: dev
    autoPromotionEnabled: true
    autoRollback:
      onVerification:
      - Failed
  # The regions, not `prod` itself: the regex requires the hyphen. prod stays
  # manual because wait-for-approval is its gate.
  - stageSelector:
      name: "regex:^prod-.+$"
    autoPromotionEnabled: true

  promotionWindows:
  # Off by default. Flip `disabled` to false to show promotions being held
  # outside a change window -- Deny wins over an active promotion policy, so
  # even the auto-promoting regions stop.
  - name: team-namho-freeze
    description: Weekday change freeze, 09:00-17:00 America/Los_Angeles
    disabled: true
    kind: Deny
    stageSelector:
      name: "regex:^prod"
    rrule: FREQ=WEEKLY;BYDAY=MO,TU,WE,TH,FR
    dtstart: TZID=America/Los_Angeles:20260105T090000
    dtend: TZID=America/Los_Angeles:20260105T170000
