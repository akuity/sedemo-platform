# dev -> staging -> prod -> prod-mocha | prod-frappe | prod-macchiato | prod-latte
#
# dev auto-promotes every new image and auto-rolls-back if its smoke check
# fails. staging gates on a pull request: one carrying the rendered manifests
# must be merged (render-pr) before it deploys, and the smol-smoke
# AnalysisTemplate has to pass afterwards. prod is the change gate -- a
# ServiceNow change request that must
# reach Implement before anything is rendered. The three regions fan out
# from prod and auto-promote, so one approved change ticket releases to all
# four.
#
# Each Stage publishes a Catppuccin palette to S3 as part of its promotion and
# smol links it, so the page's colours say which Stage you are looking at. The
# promoter picks the palette once, at staging; it is recorded on the Freight
# and prod reads it back, so staging and prod always match. The four production
# regions are named after the flavor they pin and ignore the choice. dev runs
# no Terraform at all and renders black on white.
#
# Promotion policies (who auto-promotes) live in kargo/project.yaml.
#
# yaml-language-server: $schema=https://raw.githubusercontent.com/akuity/kargo/refs/heads/main/ui/src/gen/schema/stages.kargo.akuity.io_v1alpha1.json
apiVersion: kargo.akuity.io/v1alpha1
kind: Stage
metadata:
  name: dev
  namespace: team-namho
  annotations:
    argocd.argoproj.io/sync-wave: "2"
    kargo.akuity.io/color: blue
spec:
  verification:
    analysisTemplates:
    - name: smol-smoke
    args:
    - name: namespace
      value: team-namho-dev
  requestedFreight:
  - origin:
      kind: Warehouse
      name: smol
    sources:
      direct: true
  promotionTemplate:
    spec:
      vars:
      - name: image
        value: ghcr.io/nk-87/smol
      steps:
      - uses: set-freight-alias
        config:
          name: ${{ ctx.targetFreight.name }}
          alias: ${{ imageFrom(vars.image).Tag }}
      - task:
          name: render
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/akuity/kargo/refs/heads/main/ui/src/gen/schema/stages.kargo.akuity.io_v1alpha1.json
apiVersion: kargo.akuity.io/v1alpha1
kind: Stage
metadata:
  name: staging
  namespace: team-namho
  annotations:
    argocd.argoproj.io/sync-wave: "2"
    kargo.akuity.io/color: green
spec:
  # Runs after the promotion completes: the smol-smoke AnalysisTemplate curls
  # the Service and must pass before this Freight is available downstream.
  verification:
    analysisTemplates:
    - name: smol-smoke
    args:
    - name: namespace
      value: team-namho-staging
  requestedFreight:
  - origin:
      kind: Warehouse
      name: smol
    sources:
      stages:
      - dev
  promotionTemplate:
    spec:
      vars:
      - name: image
        value: ghcr.io/nk-87/smol
      steps:
      # Which palette this release wears from here on. Asked before anything is
      # rendered, because the answer is an input to the Terraform that publishes
      # the stylesheet. Recorded on the Freight at the end of this promotion, so
      # prod inherits it without asking again.
      - uses: get-user-input
        as: theme
        config:
          display: >-
            Pick the Catppuccin palette for smol ${{ imageFrom(vars.image).Tag }}
            in staging. prod inherits this choice; the production regions are
            named after the flavor they pin and ignore it.
          schema:
            type: object
            additionalProperties: false
            required:
            - flavor
            properties:
              flavor:
                type: string
                title: Palette
                description: One of the four Catppuccin flavors.
                enum:
                - latte
                - frappe
                - macchiato
                - mocha
                default: latte

      # Deploy behind a pull request: render-pr opens a PR with the rendered
      # manifests and parks until someone merges it, then syncs. It ends on
      # argocd-update, which waits for the Application to go Healthy, so
      # everything below runs against a live app.
      - task:
          name: render-pr
        vars:
        - name: flavor
          value: ${{ outputs.theme.values.flavor }}

      - uses: set-metadata
        config:
          updates:
          - kind: Freight
            name: ${{ ctx.targetFreight.name }}
            values:
              # Read back by prod, so one choice covers both Stages.
              theme: ${{ outputs.theme.values.flavor }}
              theme-chosen-by: ${{ outputs.theme.respondedBy }}
---
# The change gate. Nothing reaches a region without passing through here.
#
# yaml-language-server: $schema=https://raw.githubusercontent.com/akuity/kargo/refs/heads/main/ui/src/gen/schema/stages.kargo.akuity.io_v1alpha1.json
apiVersion: kargo.akuity.io/v1alpha1
kind: Stage
metadata:
  name: prod
  namespace: team-namho
  annotations:
    argocd.argoproj.io/sync-wave: "2"
    kargo.akuity.io/color: red
spec:
  requestedFreight:
  - origin:
      kind: Warehouse
      name: smol
    sources:
      stages:
      - staging
  promotionTemplate:
    spec:
      vars:
      - name: image
        value: ghcr.io/nk-87/smol
      - name: jiraProject
        value: CHANGE
      - name: jiraURL
        value: https://eddiewebb.atlassian.net
      - name: approvedStatus
        value: Approved
      steps:
      # The change gate. `jira-access-secret` is synced from AWS Secrets
      # Manager into Kargo's shared resources (secrets/kargo-sync-secrets.yaml),
      # so there is nothing to provision per project -- hence sharedSecretName
      # rather than a Secret in this namespace.
      #
      # One ticket per Freight: skipped when this Freight already carries a key,
      # so re-promoting after an aborted promotion reuses the same ticket rather
      # than opening a second one.
      - uses: jira
        as: change-ticket
        if: ${{ freightMetadata(ctx.targetFreight.name)?.['jira-issue-key'] == nil }}
        config:
          credentials: &jiraCredentials
            sharedSecretName: jira-access-secret
          createIssue:
            projectKey: ${{ vars.jiraProject }}
            issueType: Task
            summary: "[team-namho] Release smol ${{ imageFrom(vars.image).Tag }} to production"
            description: >-
              Approving this ticket releases smol ${{ imageFrom(vars.image).Tag }}
              to prod, and then to prod-mocha, prod-frappe, prod-macchiato and
              prod-latte, which auto-promote the same Freight.
              Freight: ${{ ctx.targetFreight.alias }}.
              Promotion: ${{ ctx.promotion }}.
            labels:
            - team-namho
            - smol-${{ imageFrom(vars.image).Tag }}

      # Resolved once: the ticket just created, or the one this Freight already
      # carries from an earlier attempt.
      - uses: compose-output
        as: ticket
        config:
          key: ${{ outputs['change-ticket']?.key ?? freightMetadata(ctx.targetFreight.name)['jira-issue-key'] }}

      # On the Freight before the wait, so an aborted promotion can find it.
      - uses: set-metadata
        config:
          updates:
          - kind: Freight
            name: ${{ ctx.targetFreight.name }}
            values:
              jira-issue-key: ${{ outputs.ticket.key }}
              jira-issue-url: ${{ vars.jiraURL }}/browse/${{ outputs.ticket.key }}

      # One click away while the promotion is parked.
      - uses: compose-output
        as: links
        config:
          links:
          - icon: faJira
            label: ${{ outputs.ticket.key }}
            tooltip: The change ticket gating this release
            url: ${{ vars.jiraURL }}/browse/${{ outputs.ticket.key }}

      # Parks until someone moves the ticket to Approved. Nothing is rendered
      # or pushed before this returns.
      - uses: jira
        as: approve
        config:
          credentials: *jiraCredentials
          waitForStatus:
            issueKey: ${{ outputs.ticket.key }}
            expectedStatus: ${{ vars.approvedStatus }}
            pollInterval: 30s

      - task:
          name: render-infra
        vars:
        - name: flavor
          value: ${{ freightMetadata(ctx.targetFreight.name)['theme'] ?? 'latte' }}

      - uses: jira
        config:
          credentials: *jiraCredentials
          commentOnIssue:
            issueKey: ${{ outputs.ticket.key }}
            body: "Promoted smol ${{ imageFrom(vars.image).Tag }} to prod (${{ ctx.promotion }}). The four prod-<flavor> regions auto-promote the same Freight."

      # The audit record: an event in Kargo's own stream, not just an
      # annotation on the Freight.
      - uses: record-audit-event
        as: audit
        retry:
          errorThreshold: 3
        config:
          type: approved
          message: >-
            Release smol ${{ imageFrom(vars.image).Tag }} to ${{ ctx.stage }}
            approved on ${{ outputs.ticket.key }}.
          data:
            change: ${{ outputs.ticket.key }}
            freight: ${{ ctx.targetFreight.name }}

      - uses: set-metadata
        config:
          updates:
          - kind: Freight
            name: ${{ ctx.targetFreight.name }}
            values:
              prod-promotion: ${{ ctx.promotion }}

# ---------------------------------------------------------------------------
# Production regions. Identical but for name, host and the Catppuccin flavor
# each one pins; they auto-promote off prod (see promotionPolicies in
# kargo/project.yaml), so the single change request on prod is what releases to
# all four.
#
# The flavor is hard-coded here rather than inherited: a region's palette is
# how you tell at a glance which region a tab is showing, so it has to be
# stable across releases. Only staging and prod use the promoter's choice.
# ---------------------------------------------------------------------------
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/akuity/kargo/refs/heads/main/ui/src/gen/schema/stages.kargo.akuity.io_v1alpha1.json
apiVersion: kargo.akuity.io/v1alpha1
kind: Stage
metadata:
  name: prod-mocha
  namespace: team-namho
  annotations:
    argocd.argoproj.io/sync-wave: "2"
    kargo.akuity.io/color: purple
    team-namho/region: us-east
  labels:
    team-namho/region: "true"
spec:
  requestedFreight:
  - origin:
      kind: Warehouse
      name: smol
    sources:
      stages:
      - prod
      # MatchUpstream: take exactly what prod is running, not merely the
      # newest Freight prod has ever carried. All four regions converge on
      # the same image after one change request.
      autoPromotionOptions:
        selectionPolicy: MatchUpstream
  promotionTemplate:
    spec:
      vars:
      - name: image
        value: ghcr.io/nk-87/smol
      steps:
      - task:
          name: render-infra
        vars:
        - name: flavor
          value: mocha
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/akuity/kargo/refs/heads/main/ui/src/gen/schema/stages.kargo.akuity.io_v1alpha1.json
apiVersion: kargo.akuity.io/v1alpha1
kind: Stage
metadata:
  name: prod-frappe
  namespace: team-namho
  annotations:
    argocd.argoproj.io/sync-wave: "2"
    kargo.akuity.io/color: violet
    team-namho/region: eu-west
  labels:
    team-namho/region: "true"
spec:
  requestedFreight:
  - origin:
      kind: Warehouse
      name: smol
    sources:
      stages:
      - prod
      # MatchUpstream: take exactly what prod is running, not merely the
      # newest Freight prod has ever carried. All four regions converge on
      # the same image after one change request.
      autoPromotionOptions:
        selectionPolicy: MatchUpstream
  promotionTemplate:
    spec:
      vars:
      - name: image
        value: ghcr.io/nk-87/smol
      steps:
      - task:
          name: render-infra
        vars:
        - name: flavor
          value: frappe
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/akuity/kargo/refs/heads/main/ui/src/gen/schema/stages.kargo.akuity.io_v1alpha1.json
apiVersion: kargo.akuity.io/v1alpha1
