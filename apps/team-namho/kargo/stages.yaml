# dev -> staging -> prod -> prod-a | prod-b | prod-c
#
# dev auto-promotes every new image and auto-rolls-back if its smoke check
# fails. staging is the gate a human drives: it dispatches a GitHub Actions
# verification run and parks until it finishes. prod is the change gate --
# wait-for-approval, the Kargo-native stand-in for a ServiceNow change
# request. The three regions fan out from prod and auto-promote, so one
# approval releases to all three.
#
# Promotion policies (who auto-promotes) live in kargo/project.yaml.
#
# yaml-language-server: $schema=https://raw.githubusercontent.com/akuity/kargo/refs/heads/main/ui/src/gen/schema/stages.kargo.akuity.io_v1alpha1.json
apiVersion: kargo.akuity.io/v1alpha1
kind: Stage
metadata:
  name: dev
  namespace: team-namho
  annotations:
    argocd.argoproj.io/sync-wave: "2"
    kargo.akuity.io/color: blue
spec:
  verification:
    analysisTemplates:
    - name: smol-smoke
    args:
    - name: namespace
      value: team-namho-dev
  requestedFreight:
  - origin:
      kind: Warehouse
      name: smol
    sources:
      direct: true
  promotionTemplate:
    spec:
      vars:
      - name: image
        value: ghcr.io/nk-87/smol
      steps:
      - uses: set-freight-alias
        config:
          name: ${{ ctx.targetFreight.name }}
          alias: ${{ imageFrom(vars.image).Tag }}
      - task:
          name: render
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/akuity/kargo/refs/heads/main/ui/src/gen/schema/stages.kargo.akuity.io_v1alpha1.json
apiVersion: kargo.akuity.io/v1alpha1
kind: Stage
metadata:
  name: staging
  namespace: team-namho
  annotations:
    argocd.argoproj.io/sync-wave: "2"
    kargo.akuity.io/color: green
spec:
  # Runs after the promotion completes: the smol-smoke AnalysisTemplate curls
  # the Service and must pass before this Freight is available downstream.
  verification:
    analysisTemplates:
    - name: smol-smoke
    args:
    - name: namespace
      value: team-namho-staging
  requestedFreight:
  - origin:
      kind: Warehouse
      name: smol
    sources:
      stages:
      - dev
  promotionTemplate:
    spec:
      vars:
      - name: image
        value: ghcr.io/nk-87/smol
      - name: smolRepo
        value: https://github.com/nk-87/smol
      steps:
      # Deploy. `render` ends on argocd-update, which waits for the
      # Application to go Healthy, so everything below runs against a live app.
      - task:
          name: render

      # The promoter decides whether the downstream GHA run passes or fails.
      # This is purely so the demo can show both outcomes without a code change.
      - uses: get-user-input
        as: input
        config:
          display: >-
            smol ${{ imageFrom(vars.image).Tag }} is live in staging and
            answered its smoke check. Choose how the GitHub Actions
            verification run should resolve.
          schema:
            type: object
            additionalProperties: false
            required:
            - result
            properties:
              result:
                type: string
                title: Verification result
                description: >-
                  `pass` lets the promotion finish. `fail` makes the workflow
                  exit non-zero, so this promotion fails and the Freight never
                  reaches approval.
                enum:
                - pass
                - fail
                default: pass

      - uses: gha-dispatch-workflow
        as: dispatch
        config:
          repoURL: ${{ vars.smolRepo }}
          workflowFile: kargo-verify.yml
          ref: main
          inputs:
            result: ${{ quote(outputs.input.values.result) }}
            stage: ${{ quote(ctx.stage) }}
            image: ${{ quote(imageFrom(vars.image).Tag) }}
          timeout: 120

      # Surfaced before the wait so the run is one click away while parked.
      - uses: compose-output
        as: links
        config:
          links:
          - icon: faGithub
            label: Verification run
            tooltip: The kargo-verify workflow run gating this promotion
            url: ${{ vars.smolRepo }}/actions/runs/${{ outputs.dispatch.runID }}

      - uses: gha-wait-for-workflow
        config:
          repoURL: ${{ vars.smolRepo }}
          runID: ${{ outputs.dispatch.runID }}
          expectedConclusion: success
          pollInterval: 15s

      - uses: set-metadata
        config:
          updates:
          - kind: Freight
            name: ${{ ctx.targetFreight.name }}
            values:
              verified-by: ${{ outputs.input.respondedBy }}
              verify-run: ${{ vars.smolRepo }}/actions/runs/${{ outputs.dispatch.runID }}
---
# The change gate. Nothing reaches a region without passing through here.
#
# yaml-language-server: $schema=https://raw.githubusercontent.com/akuity/kargo/refs/heads/main/ui/src/gen/schema/stages.kargo.akuity.io_v1alpha1.json
apiVersion: kargo.akuity.io/v1alpha1
kind: Stage
metadata:
  name: prod
  namespace: team-namho
  annotations:
    argocd.argoproj.io/sync-wave: "2"
    kargo.akuity.io/color: red
spec:
  requestedFreight:
  - origin:
      kind: Warehouse
      name: smol
    sources:
      stages:
      - staging
  promotionTemplate:
    spec:
      vars:
      - name: image
        value: ghcr.io/nk-87/smol
      steps:
      # This is the slot ServiceNow fills in governed-teams
      # (changeGate: servicenow -> snow-create + snow-wait-for-condition;
      # changeGate: approval -> this step). Kargo-native, so there is no
      # external system to stand up.
      #
      # Empty config means anyone who can promote in this project may
      # approve. To restrict it the way governed-teams does:
      #   config:
      #     approvers:
      #     - claim: groups
      #       value: <group>
      #       required: true
      - uses: wait-for-approval
        as: approve
        config: {}
      - task:
          name: render
      # Who signed off, on the Freight itself, visible in the Kargo UI and
      # carried with it into all three regions.
      - uses: set-metadata
        config:
          updates:
          - kind: Freight
            name: ${{ ctx.targetFreight.name }}
            values:
              prod-approved-by: ${{ outputs.approve.responses[0].user }}
              prod-promotion: ${{ ctx.promotion }}

# ---------------------------------------------------------------------------
# Production regions. Identical but for name and host; they auto-promote off
# prod (see promotionPolicies in kargo/project.yaml), so the single approval
# on prod is what releases to all three.
# ---------------------------------------------------------------------------
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/akuity/kargo/refs/heads/main/ui/src/gen/schema/stages.kargo.akuity.io_v1alpha1.json
apiVersion: kargo.akuity.io/v1alpha1
kind: Stage
metadata:
  name: prod-a
  namespace: team-namho
  annotations:
    argocd.argoproj.io/sync-wave: "2"
    kargo.akuity.io/color: purple
    team-namho/region: us-east
  labels:
    team-namho/region: "true"
spec:
  requestedFreight:
  - origin:
      kind: Warehouse
      name: smol
    sources:
      stages:
      - prod
      # MatchUpstream: take exactly what prod is running, not merely the
      # newest Freight prod has ever carried. All three regions converge on
      # the same image after one approval.
      autoPromotionOptions:
        selectionPolicy: MatchUpstream
  promotionTemplate:
    spec:
      vars:
      - name: image
        value: ghcr.io/nk-87/smol
      steps:
      - task:
          name: render
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/akuity/kargo/refs/heads/main/ui/src/gen/schema/stages.kargo.akuity.io_v1alpha1.json
