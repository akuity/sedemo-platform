# staging -> prod (and prod-<x> shards). Nothing auto-promotes; each prod
# Stage's PR is its approval gate. `shards` is a platform Stage that
# provisions shards and generates their Kargo Stages.
#
# yaml-language-server: $schema=https://raw.githubusercontent.com/akuity/kargo/refs/heads/main/ui/src/gen/schema/stages.kargo.akuity.io_v1alpha1.json
apiVersion: kargo.akuity.io/v1alpha1
kind: Stage
metadata:
  name: staging
  namespace: team-namho
  annotations:
    argocd.argoproj.io/sync-wave: "2"
    kargo.akuity.io/color: green
spec:
  # Runs after the promotion completes: the smol-smoke AnalysisTemplate curls
  # the Service and must pass before this Freight is available to `approval`.
  verification:
    analysisTemplates:
    - name: smol-smoke
  requestedFreight:
  - origin:
      kind: Warehouse
      name: smol
    sources:
      direct: true
  promotionTemplate:
    spec:
      vars:
      - name: image
        value: ghcr.io/nk-87/smol
      - name: smolRepo
        value: https://github.com/nk-87/smol
      steps:
      - uses: set-freight-alias
        config:
          name: ${{ ctx.targetFreight.name }}
          alias: ${{ imageFrom(vars.image).Tag }}

      # Deploy. `render` ends on argocd-update, which waits for the
      # Application to go Healthy, so everything below runs against a live app.
      - task:
          name: render

      # The promoter decides whether the downstream GHA run passes or fails.
      # This is purely so the demo can show both outcomes without a code change.
      - uses: get-user-input
        as: input
        config:
          display: >-
            smol ${{ imageFrom(vars.image).Tag }} is live in staging and
            answered its smoke check. Choose how the GitHub Actions
            verification run should resolve.
          schema:
            type: object
            additionalProperties: false
            required:
            - result
            properties:
              result:
                type: string
                title: Verification result
                description: >-
                  `pass` lets the promotion finish. `fail` makes the workflow
                  exit non-zero, so this promotion fails and the Freight never
                  reaches approval.
                enum:
                - pass
                - fail
                default: pass

      - uses: gha-dispatch-workflow
        as: dispatch
        config:
          repoURL: ${{ vars.smolRepo }}
          workflowFile: kargo-verify.yml
          ref: main
          inputs:
            result: ${{ quote(outputs.input.values.result) }}
            stage: ${{ quote(ctx.stage) }}
            image: ${{ quote(imageFrom(vars.image).Tag) }}
          timeout: 120

      # Surfaced before the wait so the run is one click away while parked.
      - uses: compose-output
        as: links
        config:
          links:
          - icon: faGithub
            label: Verification run
            tooltip: The kargo-verify workflow run gating this promotion
            url: ${{ vars.smolRepo }}/actions/runs/${{ outputs.dispatch.runID }}

      - uses: gha-wait-for-workflow
        config:
          repoURL: ${{ vars.smolRepo }}
          runID: ${{ outputs.dispatch.runID }}
          expectedConclusion: success
          pollInterval: 15s

      - uses: set-metadata
        config:
          updates:
          - kind: Freight
            name: ${{ ctx.targetFreight.name }}
            values:
              verified-by: ${{ outputs.input.respondedBy }}
              verify-run: ${{ vars.smolRepo }}/actions/runs/${{ outputs.dispatch.runID }}
---
# Platform Stage: provisions production shards and writes the matching Kargo
# Stages back to main. Deploys no application.
#
# Flow: edit infra/shards.auto.tfvars -> promote this Stage -> OpenTofu
# applies -> generated Stage manifests and kustomize overlays are committed
# to main -> Argo CD syncs them -> the new prod-<x> Stages appear.
#
# yaml-language-server: $schema=https://raw.githubusercontent.com/akuity/kargo/refs/heads/main/ui/src/gen/schema/stages.kargo.akuity.io_v1alpha1.json
apiVersion: kargo.akuity.io/v1alpha1
kind: Stage
metadata:
  name: shards
  namespace: team-namho
  annotations:
    argocd.argoproj.io/sync-wave: "2"
    kargo.akuity.io/color: gray
spec:
  requestedFreight:
  - origin:
      kind: Warehouse
      name: team-namho-infra
    sources:
      direct: true
  promotionTemplate:
    spec:
      vars:
      - name: gitRepo
        value: https://github.com/akuity/sedemo-platform
      - name: infraDir
        value: ./src/apps/team-namho/infra
      - name: shardsFile
        value: ./src/apps/team-namho/kargo/prod-shards.yaml
      steps:
      - uses: git-clone
        config:
          repoURL: ${{ vars.gitRepo }}
          checkout:
          - branch: main
            path: ./src

      # terraform_data needs no cloud credentials; these are for the S3 state
      # backend, which has to outlive the ephemeral promotion workspace.
      - uses: tf-apply
        as: tf-apply
        config:
          dir: ${{ vars.infraDir }}
          env:
          - name: AWS_REGION
            value: us-west-2
          - name: AWS_ACCESS_KEY_ID
            value: ${% sharedSecret('kargo-terraform-steps').AWS_ACCESS_KEY_ID %}
          - name: AWS_SECRET_ACCESS_KEY
            value: ${% sharedSecret('kargo-terraform-steps').AWS_SECRET_ACCESS_KEY %}

      - uses: tf-output
        as: tf-output
        config:
          dir: ${{ vars.infraDir }}
          env:
          - name: AWS_REGION
            value: us-west-2
          - name: AWS_ACCESS_KEY_ID
            value: ${% sharedSecret('kargo-terraform-steps').AWS_ACCESS_KEY_ID %}
          - name: AWS_SECRET_ACCESS_KEY
            value: ${% sharedSecret('kargo-terraform-steps').AWS_SECRET_ACCESS_KEY %}

      # Terraform emits the manifests as a string; Kargo is what writes them.
      - uses: file-write
        config:
          path: ${{ vars.shardsFile }}
          contents: ${{ outputs['tf-output'].stages_yaml.value }}
          overwrite: true

      # Skipped when the shard list is unchanged and nothing was regenerated.
      - uses: git-commit
        as: commit
        config:
          path: ./src
          message: |
            team-namho: ${{ outputs['tf-output'].shard_count.value }} production shard(s)

            Shards: ${{ outputs['tf-output'].shard_names.value }}

            Rendered from apps/team-namho/infra outputs.
      - if: ${{ status('commit') != 'Skipped' }}
        uses: git-push
        config:
          path: ./src
          targetBranch: main
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/akuity/kargo/refs/heads/main/ui/src/gen/schema/stages.kargo.akuity.io_v1alpha1.json
apiVersion: kargo.akuity.io/v1alpha1
kind: Stage
metadata:
  name: prod
  namespace: team-namho
  annotations:
    argocd.argoproj.io/sync-wave: "2"
    kargo.akuity.io/color: pink
spec:
  requestedFreight:
  - origin:
      kind: Warehouse
      name: smol
    sources:
      stages:
      - staging
  promotionTemplate:
    spec:
      steps:
      # Renders manifests, opens a PR against rendered/team-namho/prod, and
      # parks until someone merges it.
      - task:
          name: render-pr
