# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/external-secrets.io/externalsecret_v1.json
# Shared by every PR preview: reuses dev's AWS Secrets Manager entries. Each
# preview still gets its own (emptyDir) database. No metadata.namespace, so
# Argo CD applies it in the preview's namespace (team-ada-pr-<N>).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: team-ada-postgresql
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secretsmanager
    kind: ClusterSecretStore
  target:
    name: team-ada-postgresql
  data:
  - secretKey: postgres-password
    remoteRef:
      key: team-ada-akkoma-dev-postgresql
      property: postgres-password
