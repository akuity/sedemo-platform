# Helm values shared by every team-ada stage. Each stage adds
# env/<stage>/values.yaml on top (domain, secret names); the image tag comes
# from env/<stage>/release.yaml as the image.tag parameter. Argo CD
# (argocd/application-set.yaml) and Kargo's staging render
# (kargo/stages.yaml) both use exactly these inputs, so the render diff QA
# reviews is what Argo CD deploys.
externalSecret:
  enabled: true
postgresql:
  # sedemo-primary has no CSI driver / default StorageClass -- a PVC stays
  # Pending forever (FailedScheduling: unbound immediate
  # PersistentVolumeClaims). emptyDir instead: data is lost on pod
  # restart/reschedule, fine for this demo app. storageSize stays set (inert
  # while persistence is disabled) so it's ready if persistence is ever
  # re-enabled.
  persistence:
    enabled: false
  storageSize: 2Gi
  # Demo footprint, see "Resource requests" below.
  resources:
    requests:
      cpu: 10m
      memory: 96Mi
    limits:
      cpu: "1"
      memory: 1Gi
storage:
  uploads:
    persistence:
      enabled: false
    size: 5Gi
  frontends:
    persistence:
      enabled: false
    size: 1Gi
# Host comes from akkoma.domain (akkoma-<stage>.akpdemoapps.link), served by
# the *.akpdemoapps.link wildcard record to sedemo-primary's nginx ingress;
# cert-manager issues the cert.
ingress:
  enabled: true
  className: nginx
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
  tls:
    enabled: true
# Resource requests: as small as feasible. Akkoma here is demo-only and
# never under real use, and every stage (plus each PR preview) shares
# sedemo-primary's small node pool with other teams. Chart defaults are sized
# for a real instance. Memory requests sit at the measured idle working set
# (sedemo-primary, 2026-10-16, all three stages: akkoma 14-17m CPU /
# 232-246Mi, postgresql 16-17m / 68-72Mi), so the scheduler still sees
# roughly what's used. CPU requests go to the minimum. Limits are unchanged,
# so pods can still burst (BEAM boot, db-migrate); the trade-off is that
# these pods are among the first evicted under node memory pressure.
# Effective requests per stage: akkoma pod 10m / 256Mi (init containers run
# one at a time, so the largest counts, not the sum), postgresql 10m / 96Mi.
#
# No CPU limit on akkoma is deliberate (BEAM VM bursting) -- keep it.
resources:
  requests:
    cpu: 10m
    memory: 256Mi
  limits:
    memory: 2Gi
initContainerResources:
  waitForDb:
    requests:
      cpu: 5m
      memory: 16Mi
  # db-migrate boots the same BEAM release as the main container to run
  # `pleroma_ctl migrate`. What protects it from OOMKill is the 2Gi limit,
  # kept as is; the request only reserves scheduling room for a few seconds.
  dbMigrate:
    requests:
      cpu: 10m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 2Gi
  installFrontends:
    requests:
      cpu: 5m
      memory: 32Mi
