# What prod runs, set by Kargo's promote task and read by the ApplicationSet's
# git files generator: the chart version and the image tag (passed to the
# chart as the image.tag Helm parameter). Both travel through the same
# generator refresh, so a promotion lands as a single rollout. Other Helm
# values live in values.yaml here and in ../values.yaml.
chartVersion: 0.7.2
imageTag: v3.20.1
