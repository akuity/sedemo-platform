# yaml-language-server: $schema=https://raw.githubusercontent.com/akuity/kargo/refs/heads/main/ui/src/gen/schema/promotiontasks.kargo.akuity.io_v1alpha1.json
apiVersion: kargo.akuity.io/v1alpha1
kind: PromotionTask
metadata:
  name: promote
  namespace: team-ada
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  vars:
  - name: repoURL
    value: https://github.com/akuity/sedemo-platform
  - name: chart
    value: oci://ghcr.io/adamancini/charts/akkoma
  - name: image
    value: ghcr.io/adamancini/akkoma
  steps:
  - uses: git-clone
    config:
      repoURL: ${{ vars.repoURL }}
      checkout:
      - branch: main
        path: ./src
  - uses: yaml-update
    as: update-chart-version
    config:
      path: ./src/apps/team-ada/env/${{ ctx.stage }}/release.yaml
      updates:
      - key: chartVersion
        value: ${{ chartFrom(vars.chart).Version }}
      - key: imageTag
        value: ${{ imageFrom(vars.image).Tag }}
  - uses: git-commit
    as: commit
    config:
      path: ./src
      message: "team-ada/${{ ctx.stage }}: promote akkoma chart ${{ chartFrom(vars.chart).Version }}, image ${{ imageFrom(vars.image).Tag }}"
  - uses: git-push
    config:
      path: ./src
      targetBranch: main
  # The ApplicationSet (not Kargo) applies release.yaml to the Application,
  # so Kargo's first sync can run before the new chart version reaches it.
  # With desiredRevision set, this step keeps re-syncing until the
  # Application's sync result is this chart version, and only then
  # succeeds; the Stage's health check then waits for that rollout to be
  # Healthy (pods Ready, i.e. after db-migrate) before verification starts.
  # updateTargetRevision stays false: the spec is the ApplicationSet's to
  # write. 10m instead of the 5m default leaves room for the refresh.
  - uses: argocd-update
    retry:
      timeout: 10m
    config:
      apps:
      - name: team-ada-${{ ctx.stage }}
        sources:
        - repoURL: ghcr.io/adamancini/charts
          chart: akkoma
          desiredRevision: ${{ chartFrom(vars.chart).Version }}
          updateTargetRevision: false
