# yaml-language-server: $schema=https://raw.githubusercontent.com/akuity/kargo/refs/heads/main/ui/src/gen/schema/promotiontasks.kargo.akuity.io_v1alpha1.json
apiVersion: kargo.akuity.io/v1alpha1
kind: PromotionTask
metadata:
  name: promote
  namespace: team-ada
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  vars:
  - name: repoURL
    value: https://github.com/akuity/sedemo-platform
  - name: chart
    value: oci://ghcr.io/adamancini/charts/akkoma
  - name: image
    value: ghcr.io/adamancini/akkoma
  steps:
  # GPG-signs the promotion commit. name/email must match the key's UID --
  # see apps/team-ada/SECRETS.md.
  - uses: git-clone
    config:
      repoURL: ${{ vars.repoURL }}
      author:
        name: Ada Mancini
        email: ada.mancini@akuity.io
        signingKey: ${{ sharedSecret('team-ada-kargo-signing-key').signingKey }}
      checkout:
      - branch: main
        path: ./src
  - uses: yaml-update
    as: update-chart-version
    config:
      path: ./src/apps/team-ada/env/${{ ctx.stage }}/release.yaml
      updates:
      - key: chartVersion
        value: ${{ chartFrom(vars.chart).Version }}
      - key: imageTag
        value: ${{ imageFrom(vars.image).Tag }}
      - key: imageDigest
        value: ${{ imageFrom(vars.image).Digest }}
  - uses: git-commit
    as: commit
    config:
      path: ./src
      message: "team-ada/${{ ctx.stage }}: promote akkoma chart ${{ chartFrom(vars.chart).Version }}, image ${{ imageFrom(vars.image).Tag }}"
  - uses: git-push
    config:
      path: ./src
      targetBranch: main
  # The ApplicationSet (not Kargo) applies release.yaml to the Application,
  # so Kargo's first sync can run before the new chart version reaches it.
  # With desiredRevision set, this step keeps re-syncing until the
  # Application's sync result is this chart version, and only then
  # succeeds; the Stage's health check then waits for that rollout to be
  # Healthy (pods Ready, i.e. after db-migrate) before verification starts.
  # updateTargetRevision stays false: the spec is the ApplicationSet's to
  # write. 10m instead of the 5m default leaves room for the refresh.
  - uses: argocd-update
    retry:
      timeout: 10m
    config:
      apps:
      - name: team-ada-${{ ctx.stage }}
        sources:
        - repoURL: ghcr.io/adamancini/charts
          chart: akkoma
          desiredRevision: ${{ chartFrom(vars.chart).Version }}
          updateTargetRevision: false
---
# Audit event for a Jira approval gate, run right after the stage's
# `waitForStatus` step. That step only waits for the status and doesn't say
# who set it, so this looks it up in the ticket's changelog: the most recent
# transition into the approved status. The lookup is best-effort: if it
# fails, the event still gets recorded, with the approver as "unknown (see
# the ticket's history)". The event's actor stays the promotion's (Jira
# users aren't Kargo identities). The approver goes in the message and data.
#
# yaml-language-server: $schema=https://raw.githubusercontent.com/akuity/kargo/refs/heads/main/ui/src/gen/schema/promotiontasks.kargo.akuity.io_v1alpha1.json
apiVersion: kargo.akuity.io/v1alpha1
kind: PromotionTask
metadata:
  name: audit-jira-approval
  namespace: team-ada
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  vars:
  # Release ticket, e.g. CHANGE-123
  - name: issueKey
  # Status the gate waited for, e.g. UAT
  - name: approvedStatus
  # Who the gate is for, for the message, e.g. "QA" or "VP"
  - name: approver
  steps:
  - uses: jira
    as: issue
    continueOnError: true
    config:
      credentials:
        sharedSecretName: jira-access-secret
      searchIssue:
        jql: key = ${{ vars.issueKey }}
        fields:
        - status
        expands:
        - changelog
  - uses: compose-output
    as: approval
    continueOnError: true
    config:
      transition: >-
        ${{ last(sortBy(filter(task.outputs.issue.changelog.histories,
        any(.items, .field == 'status' && .toString == vars.approvedStatus)),
        .created)) }}
  - uses: record-audit-event
    as: audit
    retry:
      errorThreshold: 3
    config:
      type: approved
      message: >-
        ${{ vars.approver }} approved chart
        ${{ chartFrom("oci://ghcr.io/adamancini/charts/akkoma").Version }}
        (image ${{ imageFrom("ghcr.io/adamancini/akkoma").Tag }}) for
        ${{ ctx.stage }}: ${{ vars.issueKey }} moved to ${{ vars.approvedStatus }}
        by ${{ task.outputs.approval?.transition?.author?.displayName ??
        "unknown (see the ticket's history)" }}.
      data:
        stage: ${{ ctx.stage }}
        freight: ${{ ctx.targetFreight.name }}
        chartVersion: ${{ quote(chartFrom("oci://ghcr.io/adamancini/charts/akkoma").Version) }}
        imageTag: ${{ quote(imageFrom("ghcr.io/adamancini/akkoma").Tag) }}
        jiraIssue: ${{ vars.issueKey }}
        jiraStatus: ${{ vars.approvedStatus }}
        jiraApprover: ${{ quote(task.outputs.approval?.transition?.author?.displayName ?? '') }}
        jiraApproverAccountId: ${{ quote(task.outputs.approval?.transition?.author?.accountId ?? '') }}
        approvedAt: ${{ quote(task.outputs.approval?.transition?.created ?? '') }}
