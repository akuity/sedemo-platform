# yaml-language-server: $schema=https://raw.githubusercontent.com/akuity/kargo/refs/heads/main/ui/src/gen/schema/projects.kargo.akuity.io_v1alpha1.json
apiVersion: kargo.akuity.io/v1alpha1
kind: Project
metadata:
  name: team-ada
  annotations:
    argocd.argoproj.io/sync-wave: "1"
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/akuity/kargo/refs/heads/main/ui/src/gen/schema/projectconfigs.kargo.akuity.io_v1alpha1.json
apiVersion: kargo.akuity.io/v1alpha1
kind: ProjectConfig
metadata:
  name: team-ada
  namespace: team-ada
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  stageLinks:
  - title: Akkoma
    description: The Akkoma instance running at this stage
    url: 'https://akkoma-{{ .stage.metadata.name }}.akpdemoapps.link/'
  # `release` and `prod` are deliberately absent: both are manual.
  promotionPolicies:
  # Every commit on akkoma-helm main.
  - stageSelector:
      name: dev
    autoPromotionEnabled: true
  # Every new chart release. Blocks until QA moves the Jira ticket to UAT.
  - stageSelector:
      name: staging
    autoPromotionEnabled: true
