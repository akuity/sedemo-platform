# Two lanes, fed by adamancini/akkoma-helm's CI (see its CLAUDE.md, "Build,
# Release and Promotion"):
#
#   akkoma-main     every commit on main: dev chart 0.0.0-main.<ts>.g<sha8>
#                   pinning image main-<ts>-<sha8>.        -> dev -> release
#   akkoma-release  chart releases X.Y.Z (cut by the `release` Stage) and the
#                   Akkoma-version image (vX.Y.Z) each one pins.
#                                                          -> staging -> prod
#
# Freight never changes Warehouse, so a release is a *new* Freight in
# akkoma-release, not the dev Freight moving on.
#
# yaml-language-server: $schema=https://raw.githubusercontent.com/akuity/kargo/refs/heads/main/ui/src/gen/schema/warehouses.kargo.akuity.io_v1alpha1.json
apiVersion: kargo.akuity.io/v1alpha1
kind: Warehouse
metadata:
  name: akkoma-main
  namespace: team-ada
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  interval: 5m
  # Chart and image are discovered independently; only create Freight when
  # both come from the same commit (same timestamp and sha). CI pushes the
  # image before the chart, so a mismatch is transient.
  freightCreationCriteria:
    expression: |
      chartFrom('oci://ghcr.io/adamancini/charts/akkoma').Version ==
        '0.0.0-main.' + replace(trimPrefix(imageFrom('ghcr.io/adamancini/akkoma').Tag, 'main-'), '-', '.g')
  subscriptions:
  - chart:
      repoURL: oci://ghcr.io/adamancini/charts/akkoma
      # Only the dev-lane prereleases; excludes every X.Y.Z release.
      semverConstraint: '>=0.0.0-0 <0.0.1-0'
  - image:
      repoURL: ghcr.io/adamancini/akkoma
      # Lexical, not NewestBuild: chart-only commits reuse the same image
      # (same digest and build time), so only the timestamp in the tag
      # orders them.
      imageSelectionStrategy: Lexical
      allowTagsRegexes:
      - '^main-[0-9]{14}-[0-9a-f]{8}$'
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/akuity/kargo/refs/heads/main/ui/src/gen/schema/warehouses.kargo.akuity.io_v1alpha1.json
apiVersion: kargo.akuity.io/v1alpha1
kind: Warehouse
metadata:
  name: akkoma-release
  namespace: team-ada
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  interval: 5m
  subscriptions:
  - chart:
      repoURL: oci://ghcr.io/adamancini/charts/akkoma
      # No prerelease part, so 0.0.0-main.* dev charts never match.
      semverConstraint: '>=0.6.0'
  # The newest vX.Y.Z is the image the newest chart release pins: release.yml
  # creates that tag before it pushes the chart. Releasing an *older* commit
  # (older appVersion) under a newer chart version would break that pairing.
  - image:
      repoURL: ghcr.io/adamancini/akkoma
      imageSelectionStrategy: SemVer
      constraint: '>=3.0.0'
      allowTagsRegexes:
      - '^v[0-9]+\.[0-9]+\.[0-9]+$'
