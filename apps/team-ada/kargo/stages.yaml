# Two lanes (see warehouse.yaml):
#
#   akkoma-main:     dev -> release
#     dev      auto-promotes every commit on akkoma-helm main (dev chart +
#              its image) and verifies it. No Jira ticket: that would be one
#              per merge.
#     release  manual. Cuts chart release X.Y.Z from the dev Freight's commit
#              by dispatching akkoma-helm's release.yml and waiting for it.
#              The version comes from the Freight's alias: rename it (e.g.
#              v0.7.0) before promoting. Deploys nothing.
#
#   akkoma-release:  staging -> prod
#     staging  (UAT) auto-promoted when a release appears. Creates the
#              release's Jira ticket in CHANGE (status Open) -- the jira step
#              stores its key in the Freight's metadata (`jira-issue-key`) --
#              renders the release with staging's values to
#              rendered/team-ada/staging and comments a GitHub compare link
#              (running -> this release) for dev/QA, then waits for QA to
#              move the ticket to UAT ("Approve for Testing"), deploys, and
#              comments.
#     prod     posts the chart's GitHub release notes on the same ticket for
#              the VP, waits for it to be Approved (VP sign-off), deploys,
#              comments.
#
# CHANGE workflow: Open -> UAT -> Approved, with Declined from anywhere.
# `Approved` is a global transition, so a ticket approved straight from Open
# never reaches UAT and the staging promotion keeps waiting -- move tickets
# through UAT first.
#
# Kargo gates on the ticket's status, not on who set it -- the Jira workflow's
# transition permissions decide who may approve.
#
# yaml-language-server: $schema=https://raw.githubusercontent.com/akuity/kargo/refs/heads/main/ui/src/gen/schema/stages.kargo.akuity.io_v1alpha1.json
apiVersion: kargo.akuity.io/v1alpha1
kind: Stage
metadata:
  name: dev
  namespace: team-ada
  annotations:
    argocd.argoproj.io/sync-wave: "2"
    kargo.akuity.io/color: green
    kargo.akuity.io/argocd-context: '[{"name":"team-ada-dev","namespace":"argocd"}]'
spec:
  requestedFreight:
  - origin:
      kind: Warehouse
      name: akkoma-main
    sources:
      direct: true
  verification:
    analysisTemplates:
    - name: akkoma-smoke-test
    args:
    - name: domain
      value: akkoma-dev.akpdemoapps.link
    # main-<ts>-<sha8> doesn't carry the Akkoma version; skip that check.
    - name: akkoma-version
      value: any
  promotionTemplate:
    spec:
      steps:
      - task:
          name: promote
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/akuity/kargo/refs/heads/main/ui/src/gen/schema/stages.kargo.akuity.io_v1alpha1.json
apiVersion: kargo.akuity.io/v1alpha1
kind: Stage
metadata:
  name: release
  namespace: team-ada
  annotations:
    argocd.argoproj.io/sync-wave: "2"
    kargo.akuity.io/color: violet
spec:
  requestedFreight:
  - origin:
      kind: Warehouse
      name: akkoma-main
    # Freight must have passed dev verification (or been manually approved
    # for release) to be released.
    sources:
      stages:
      - dev
  promotionTemplate:
    spec:
      vars:
      - name: chart
        value: oci://ghcr.io/adamancini/charts/akkoma
      - name: repoURL
        value: https://github.com/adamancini/akkoma-helm
      steps:
      # Read the alias once: vars and ctx are re-evaluated on every step, so
      # renaming the alias mid-release would otherwise change what gets
      # recorded. TODO: replace with get-user-input (a form in the promotion)
      # once the instance runs Kargo >= v1.12 on the Akuity Platform.
      - uses: compose-output
        as: rel
        config:
          alias: ${{ quote(ctx.targetFreight.alias) }}
          version: ${{ quote(trimPrefix(ctx.targetFreight.alias, 'v')) }}
          # dev chart version is 0.0.0-main.<ts>.g<sha8>. quote(): an
          # all-digit sha would otherwise be turned into a number.
          sha: ${{ quote(split(chartFrom(vars.chart).Version, '.g')[1]) }}
      - uses: fail
        if: ${{ !(outputs.rel.alias matches '^v?[0-9]+\\.[0-9]+\\.[0-9]+$') }}
        config:
          message: >-
            Set this Freight's alias to the release version (e.g. v0.7.0)
            before promoting it to release. Its alias is
            '${{ outputs.rel.alias }}'.
      # release.yml enforces the packaging rules (version newer than the last
      # release, write-once image tag, ...) and fails the run if one is broken.
      - uses: gha-dispatch-workflow
        as: dispatch
        config:
          repoURL: ${{ vars.repoURL }}
          workflowFile: release.yml
          ref: main
          inputs:
            sha: ${{ quote(outputs.rel.sha) }}
            version: ${{ quote(outputs.rel.version) }}
          timeout: 120
      - uses: gha-wait-for-workflow
        config:
          repoURL: ${{ vars.repoURL }}
          runID: ${{ outputs.dispatch.runID }}
          expectedConclusion: success
          pollInterval: 30s
      # The alias can be renamed later; this records what was released.
      - uses: set-metadata
        config:
          updates:
          - kind: Freight
            name: ${{ ctx.targetFreight.name }}
            values:
              releasedAs: ${{ quote(outputs.rel.version) }}
              releasedBy: ${{ ctx.meta.promotion.actor }}
              releaseRun: ${{ vars.repoURL }}/actions/runs/${{ outputs.dispatch.runID }}
      - uses: compose-output
        as: links
        config:
          links:
          - icon: faGithub
            label: chart ${{ outputs.rel.version }}
            tooltip: GitHub release for this chart version
            url: ${{ vars.repoURL }}/releases/tag/chart-v${{ outputs.rel.version }}
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/akuity/kargo/refs/heads/main/ui/src/gen/schema/stages.kargo.akuity.io_v1alpha1.json
apiVersion: kargo.akuity.io/v1alpha1
kind: Stage
metadata:
  name: staging
  namespace: team-ada
  annotations:
    argocd.argoproj.io/sync-wave: "2"
    kargo.akuity.io/color: amber
    kargo.akuity.io/argocd-context: '[{"name":"team-ada-staging","namespace":"argocd"}]'
spec:
  requestedFreight:
  - origin:
      kind: Warehouse
      name: akkoma-release
    sources:
      direct: true
  verification:
    analysisTemplates:
    - name: akkoma-smoke-test
    args:
    - name: domain
      value: akkoma-staging.akpdemoapps.link
    # Release images are tagged with the Akkoma version (vX.Y.Z).
    - name: akkoma-version
      value: ${{ quote(trimPrefix(imageFrom("ghcr.io/adamancini/akkoma").Tag, 'v')) }}
  promotionTemplate:
    spec:
      vars:
      - name: jiraProject
        value: CHANGE
      - name: jiraURL
        value: https://eddiewebb.atlassian.net
      - name: approvedStatus
        value: UAT
      - name: chartVersion
        value: ${{ chartFrom("oci://ghcr.io/adamancini/charts/akkoma").Version }}
      - name: imageTag
        value: ${{ imageFrom("ghcr.io/adamancini/akkoma").Tag }}
      - name: imageDigest
        value: ${{ imageFrom("ghcr.io/adamancini/akkoma").Digest }}
      - name: repoURL
        value: https://github.com/akuity/sedemo-platform
      steps:
      # Guard: akkoma-release discovers the newest chart and the newest
      # vX.Y.Z image independently, and release.yml tags the image just
      # before it pushes the chart. A discovery in between pairs the
      # *previous* chart with the *new* image. Catch that before opening a
      # ticket; the matching Freight follows on the next discovery.
      - uses: oci-download
        config:
          imageRef: ghcr.io/adamancini/charts/akkoma:${{ vars.chartVersion }}
          outPath: ./chart.tgz
          mediaType: application/vnd.cncf.helm.chart.content.v1.tar+gzip
      - uses: untar
        config:
          inPath: ./chart.tgz
          outPath: ./chart
      - uses: yaml-parse
        as: chart-meta
        config:
          path: ./chart/akkoma/Chart.yaml
          outputs:
          - name: appVersion
            fromExpression: appVersion
      - uses: fail
        if: ${{ outputs['chart-meta'].appVersion != vars.imageTag }}
        config:
          message: >-
            Chart ${{ vars.chartVersion }} runs Akkoma
            ${{ outputs['chart-meta'].appVersion }}, but this Freight pairs it
            with image ${{ vars.imageTag }} -- it was discovered mid-release.
            Promote the newer Freight with the matching chart instead.
      # One ticket per release: skipped when this Freight already has one
      # (e.g. re-promoting it after an aborted promotion).
      - uses: jira
        as: create-release-ticket
        if: ${{ freightMetadata(ctx.targetFreight.name)?.['jira-issue-key'] == nil }}
        config:
          credentials:
            sharedSecretName: jira-access-secret
          createIssue:
            projectKey: ${{ vars.jiraProject }}
            issueType: Task
            summary: "[team-ada] Release akkoma chart ${{ vars.chartVersion }}, image ${{ vars.imageTag }}"
            description: "Chart ${{ vars.chartVersion }} is released and ready for UAT. Approve for Testing to deploy it to staging (UAT), then Approve to release to prod. Freight: ${{ ctx.targetFreight.name }}. Promotion: ${{ ctx.promotion }}."
            labels:
            - team-ada
            - release-${{ vars.chartVersion }}
      # Render what this promotion will deploy -- the release chart with
      # staging's real values (env/values.yaml + env/staging/values.yaml,
      # the same files Argo CD uses) -- commit it to
      # rendered/team-ada/staging, and give dev/QA a GitHub compare link
      # from what's running now to what this release changes, before they
      # approve. Nothing is deployed from that branch; it's for review.
      # Own clone path (./render-src): the promote task below clones main to
      # ./src in this same promotion work dir, and git refuses to reuse a
      # non-empty path.
      - uses: git-clone
        as: clone
        config:
          repoURL: ${{ vars.repoURL }}
          checkout:
          - branch: main
            path: ./render-src
            as: render-src
          - branch: rendered/team-ada/${{ ctx.stage }}
            create: true
            path: ./rendered
            as: rendered
      - uses: yaml-update
        config:
          path: ./render-src/apps/team-ada/env/${{ ctx.stage }}/release.yaml
          updates:
          - key: chartVersion
            value: ${{ vars.chartVersion }}
          - key: imageTag
            value: ${{ vars.imageTag }}
          - key: imageDigest
            value: ${{ vars.imageDigest }}
      - uses: git-clear
        config:
          path: ./rendered
      # Same release name and namespace Argo CD uses for team-ada-<stage>.
      - uses: helm-template
        config:
          path: ./chart/akkoma
          releaseName: team-ada-${{ ctx.stage }}
          namespace: team-ada-${{ ctx.stage }}
          valuesFiles:
          - ./render-src/apps/team-ada/env/values.yaml
          - ./render-src/apps/team-ada/env/${{ ctx.stage }}/values.yaml
          # Argo CD passes release.yaml's imageTag and imageDigest as the
          # image.tag and image.digest parameters.
          setValues:
          - key: image.tag
            value: ${{ vars.imageTag }}
            literal: true
          - key: image.digest
            value: ${{ vars.imageDigest }}
            literal: true
          outPath: ./rendered/manifests
      # The inputs too, so the diff shows value changes alongside their
      # effect, plus the ExternalSecrets Argo CD applies next to the chart.
      - uses: copy
        config:
          inPath: ./render-src/apps/team-ada/env/${{ ctx.stage }}
          outPath: ./rendered/env/${{ ctx.stage }}
      - uses: copy
        config:
          inPath: ./render-src/apps/team-ada/env/values.yaml
          outPath: ./rendered/env/values.yaml
      - uses: git-commit
        config:
          path: ./rendered
          message: "team-ada/${{ ctx.stage }}: render akkoma chart ${{ vars.chartVersion }}, image ${{ vars.imageTag }} (Freight ${{ ctx.targetFreight.name }})"
      - uses: git-push
        as: render-push
        config:
          path: ./rendered
          targetBranch: rendered/team-ada/${{ ctx.stage }}
      # Diff base: the render recorded when staging last deployed (set
      # below), so an aborted or rejected promotion's render never becomes
      # the baseline. First time: the branch's previous head, if any.
      - uses: compose-output
        as: render
        config:
          base: ${{ quote(stageMetadata(ctx.stage)?.renderedCommit ?? outputs.clone.commits.rendered ?? '') }}
          head: ${{ quote(outputs['render-push'].commit) }}
      - uses: compose-output
        as: diff
        config:
          url: >-
            ${{ outputs.render.base == '' || outputs.render.base == outputs.render.head
            ? vars.repoURL + '/tree/' + outputs.render.head
            : vars.repoURL + '/compare/' + outputs.render.base + '...' + outputs.render.head }}
      - uses: jira
        config:
          credentials:
            sharedSecretName: jira-access-secret
          commentOnIssue:
            issueKey: ${{ outputs['create-release-ticket']?.key ?? freightMetadata(ctx.targetFreight.name)['jira-issue-key'] }}
            # adfBody, not body: body is plain text, so URLs in it aren't links.
            adfBody:
              type: doc
              version: 1
              content:
              - type: paragraph
                content:
                - type: text
                  text: "Rendered manifests for chart ${{ vars.chartVersion }}, image ${{ vars.imageTag }}, compared with what's running in ${{ ctx.stage }}: "
                - type: text
                  text: rendered diff on GitHub
                  marks:
                  - type: link
                    attrs:
                      href: ${{ outputs.diff.url }}
                - type: text
                  text: ". Dev/QA: review the diff, then Approve for Testing to deploy."
      - uses: jira
        as: wait-for-qa-approval
        config:
          credentials:
            sharedSecretName: jira-access-secret
          waitForStatus:
            issueKey: ${{ outputs['create-release-ticket']?.key ?? freightMetadata(ctx.targetFreight.name)['jira-issue-key'] }}
            expectedStatus: ${{ vars.approvedStatus }}
            pollInterval: 30s
      - task:
          name: promote
      # Baseline for the next staging diff: what's now actually deployed.
      - uses: set-metadata
        config:
          updates:
          - kind: Stage
            name: ${{ ctx.stage }}
            values:
              renderedCommit: ${{ quote(outputs.render.head) }}
      - uses: jira
        config:
          credentials:
            sharedSecretName: jira-access-secret
          commentOnIssue:
            issueKey: ${{ outputs['create-release-ticket']?.key ?? freightMetadata(ctx.targetFreight.name)['jira-issue-key'] }}
            body: "Promoted to ${{ ctx.stage }} (UAT) after QA approval; it's verified once the rollout is healthy. Promotion: ${{ ctx.promotion }}. Approve this ticket to release to prod."
      - uses: compose-output
        as: links
        config:
          links:
          - icon: faJira
            label: ${{ outputs['create-release-ticket']?.key ?? freightMetadata(ctx.targetFreight.name)['jira-issue-key'] }}
            tooltip: Release ticket for this Freight
            url: ${{ vars.jiraURL }}/browse/${{ outputs['create-release-ticket']?.key ?? freightMetadata(ctx.targetFreight.name)['jira-issue-key'] }}
          - icon: faGithub
            label: rendered diff
            tooltip: Rendered manifests, running vs this release
            url: ${{ outputs.diff.url }}
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/akuity/kargo/refs/heads/main/ui/src/gen/schema/stages.kargo.akuity.io_v1alpha1.json
apiVersion: kargo.akuity.io/v1alpha1
kind: Stage
metadata:
  name: prod
  namespace: team-ada
  annotations:
    argocd.argoproj.io/sync-wave: "2"
    kargo.akuity.io/color: red
    kargo.akuity.io/argocd-context: '[{"name":"team-ada-prod","namespace":"argocd"}]'
spec:
  requestedFreight:
  - origin:
      kind: Warehouse
      name: akkoma-release
    sources:
      stages:
      - staging
  verification:
    analysisTemplates:
    - name: akkoma-smoke-test
    args:
    - name: domain
      value: akkoma-prod.akpdemoapps.link
    # Release images are tagged with the Akkoma version (vX.Y.Z).
    - name: akkoma-version
      value: ${{ quote(trimPrefix(imageFrom("ghcr.io/adamancini/akkoma").Tag, 'v')) }}
  promotionTemplate:
    spec:
      vars:
      - name: approvedStatus
        value: Approved
      - name: issueKey
        value: ${{ freightMetadata(ctx.targetFreight.name)['jira-issue-key'] }}
      - name: chartVersion
        value: ${{ chartFrom("oci://ghcr.io/adamancini/charts/akkoma").Version }}
      - name: imageTag
        value: ${{ imageFrom("ghcr.io/adamancini/akkoma").Tag }}
      steps:
      # Release notes for the VP's sign-off: the chart's GitHub release
      # (notes generated from the PRs merged since the last release, by
      # akkoma-helm's release.yml), posted on the release ticket before the
      # Approved gate. github-pr-token: sharedSecret() only exposes generic
      # secrets, and this is a read of a public repo.
      - uses: http
        as: release
        config:
          method: GET
          url: https://api.github.com/repos/adamancini/akkoma-helm/releases/tags/chart-v${{ vars.chartVersion }}
          headers:
          - name: Authorization
            value: "Bearer ${{ sharedSecret('github-pr-token').token }}"
          - name: Accept
            value: application/vnd.github+json
          - name: X-GitHub-Api-Version
            value: "2022-11-28"
          successExpression: response.status == 200
          # Fail loudly (404, bad/expired token, rate limit) instead of
          # polling forever.
          failureExpression: response.status != 200
          outputs:
          - name: url
            fromExpression: response.body.html_url
          # Jira comments cap out at 32767 characters.
          - name: notes
            fromExpression: >-
              (response.body.body ?? '') == '' ? '(no release notes)'
              : len(response.body.body) > 20000
              ? response.body.body[0:20000] + ' ... (truncated, see the full release)'
              : response.body.body
      - uses: jira
        config:
          credentials:
            sharedSecretName: jira-access-secret
          commentOnIssue:
            issueKey: ${{ vars.issueKey }}
            # adfBody so the links are links. The notes are GitHub markdown,
            # which Jira doesn't render: a code block keeps their layout.
            adfBody:
              type: doc
              version: 1
              content:
              - type: paragraph
                content:
                - type: text
                  text: "Prod sign-off requested for akkoma chart ${{ vars.chartVersion }} (Akkoma ${{ vars.imageTag }})."
              - type: paragraph
                content:
                - type: text
                  text: "Chart release: "
                - type: text
                  text: chart-v${{ vars.chartVersion }} on GitHub
                  marks:
                  - type: link
                    attrs:
                      href: ${{ outputs.release.url }}
                - type: hardBreak
                - type: text
                  text: "Upstream Akkoma release: "
                - type: text
                  text: ${{ vars.imageTag }} on akkoma.dev
                  marks:
                  - type: link
                    attrs:
                      href: https://akkoma.dev/AkkomaGang/akkoma/releases/tag/${{ vars.imageTag }}
              - type: heading
                attrs:
                  level: 3
                content:
                - type: text
                  text: Release notes
              - type: codeBlock
                content:
                - type: text
                  # quote(): notes that look like JSON stay a string.
                  text: ${{ quote(outputs.release.notes) }}
              - type: paragraph
                content:
                - type: text
                  text: Approve this ticket to release to prod.
      - uses: compose-output
        as: links
        config:
          links:
          - icon: faGithub
            label: chart ${{ vars.chartVersion }} release notes
            tooltip: GitHub release for this chart version
            url: ${{ outputs.release.url }}
          - icon: faJira
            label: ${{ vars.issueKey }}
            tooltip: Release ticket for this Freight
            url: https://eddiewebb.atlassian.net/browse/${{ vars.issueKey }}
      - uses: jira
        as: wait-for-vp-approval
        config:
          credentials:
            sharedSecretName: jira-access-secret
          waitForStatus:
            issueKey: ${{ vars.issueKey }}
            expectedStatus: ${{ vars.approvedStatus }}
            pollInterval: 30s
      - task:
          name: promote
      - uses: jira
        config:
          credentials:
            sharedSecretName: jira-access-secret
          commentOnIssue:
            issueKey: ${{ vars.issueKey }}
            body: "Deployed to ${{ ctx.stage }} after VP approval. Promotion: ${{ ctx.promotion }}."
