# Smoke test of a running stage, from outside the cluster: Kargo runs it as
# each Stage's verification after a promotion. akkoma-helm's CI already lints
# and renders the chart and install-tests it in kind on every PR; this checks
# what only the real environment can show -- that the instance answers on its
# public URL (ingress, TLS, DNS), is Akkoma, and runs the expected version.
#
# Each metric takes 3 measurements 20s apart and tolerates one failure, so a
# pod that only just turned Ready doesn't fail the verification.
#
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/argoproj.io/analysistemplate_v1alpha1.json
apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: akkoma-smoke-test
  namespace: team-ada
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  args:
  # Host the stage serves, e.g. akkoma-dev.akpdemoapps.link
  - name: domain
  # Expected Akkoma version without the leading v (e.g. 3.20.0), or "any".
  # dev passes "any": its image tag (main-<ts>-<sha8>) doesn't carry it.
  - name: akkoma-version
  metrics:
  # The instance on this host answers, and knows itself by this host.
  - name: instance-api
    initialDelay: 15s
    count: 3
    interval: 20s
    failureLimit: 1
    successCondition: result == '{{ args.domain }}'
    provider:
      web:
        url: https://{{ args.domain }}/api/v1/instance
        timeoutSeconds: 10
        jsonPath: '{$.uri}'
  # It's Akkoma, not some other server behind the same host.
  - name: nodeinfo-software
    initialDelay: 15s
    count: 3
    interval: 20s
    failureLimit: 1
    successCondition: result == 'akkoma'
    provider:
      web:
        url: https://{{ args.domain }}/nodeinfo/2.0.json
        timeoutSeconds: 10
        jsonPath: '{$.software.name}'
  # It runs the Akkoma version this Freight's image claims
  # (nodeinfo reports e.g. 3.20.0-v3-20-0 for image v3.20.0).
  - name: nodeinfo-version
    initialDelay: 15s
    count: 3
    interval: 20s
    failureLimit: 1
    successCondition: >-
      '{{ args.akkoma-version }}' == 'any' ||
      result startsWith '{{ args.akkoma-version }}'
    provider:
      web:
        url: https://{{ args.domain }}/nodeinfo/2.0.json
        timeoutSeconds: 10
        jsonPath: '{$.software.version}'
