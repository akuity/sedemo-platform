# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/argoproj.io/applicationset_v1alpha1.json
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: team-ada
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
  - git:
      repoURL: https://github.com/akuity/sedemo-platform
      revision: HEAD
      files:
      - path: "apps/team-ada/env/*/release.yaml"
  template:
    metadata:
      name: 'team-ada-{{.path.basename}}'
      annotations:
        kargo.akuity.io/authorized-stage: 'team-ada:{{.path.basename}}'
    spec:
      project: team-ada
      sources:
      - repoURL: ghcr.io/adamancini/charts
        chart: akkoma
        targetRevision: '{{.chartVersion}}'
        helm:
          valuesObject:
            akkoma:
              domain: '{{.values.akkoma.domain}}'
              adminEmail: '{{.values.akkoma.adminEmail}}'
            externalSecret:
              enabled: true
              name: '{{.values.externalSecret.name}}'
            postgresql:
              existingSecret: '{{.values.postgresql.existingSecret}}'
              # sedemo-primary has no CSI driver / default StorageClass -- a
              # PVC stays Pending forever (FailedScheduling: unbound
              # immediate PersistentVolumeClaims). emptyDir instead: data is
              # lost on pod restart/reschedule, fine for this demo app.
              # storageSize stays set (inert while persistence is disabled)
              # so it's ready if persistence is ever re-enabled.
              persistence:
                enabled: false
              storageSize: 2Gi
              # Chart defaults (250m/512Mi request) are sized for a real
              # instance -- three concurrent stages on sedemo-primary's
              # small shared node pool couldn't all get scheduled
              # (FailedScheduling: Insufficient cpu, no preemption victims).
              # Limits are untouched; only requests shrink.
              resources:
                requests:
                  cpu: 50m
                  memory: 256Mi
                limits:
                  cpu: "1"
                  memory: 1Gi
            storage:
              uploads:
                persistence:
                  enabled: false
                size: 5Gi
              frontends:
                persistence:
                  enabled: false
                size: 1Gi
            ingress:
              enabled: false
            image:
              tag: '{{.values.image.tag}}'
            # Same demo-footprint reasoning as postgresql.resources above.
            # No CPU limit here is deliberate (BEAM VM bursting) -- keep it.
            resources:
              requests:
                cpu: 100m
                memory: 512Mi
              limits:
                memory: 2Gi
            initContainerResources:
              dbMigrate:
                requests:
                  # Memory NOT reduced -- this boots the same BEAM/OTP
                  # release as the main container just to run
                  # `pleroma_ctl migrate`; too little risks OOMKill before
                  # any migration work happens. Only CPU is safe to shrink.
                  cpu: 100m
                  memory: 1Gi
                limits:
                  cpu: "1"
                  memory: 2Gi
      - repoURL: https://github.com/akuity/sedemo-platform
        targetRevision: HEAD
        path: '{{.path.path}}'
        directory:
          include: 'externalsecret-*.yaml'
      destination:
        name: sedemo-primary
        namespace: 'team-ada-{{.path.basename}}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
        - CreateNamespace=true
