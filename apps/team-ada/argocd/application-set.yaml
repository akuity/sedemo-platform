# One Argo CD Application per env/*/release.yaml. Multi-source: the OCI
# chart at the version Kargo last promoted, plus this repo's own path for
# the stage's ExternalSecrets (created by ESO from AWS Secrets Manager --
# see env/<stage>/externalsecret-*.yaml -- not a Kargo release artifact).
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: team-ada
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
  - git:
      repoURL: https://github.com/akuity/sedemo-platform
      revision: HEAD
      files:
      - path: "apps/team-ada/env/*/release.yaml"
  template:
    metadata:
      name: 'team-ada-{{.path.basename}}'
      annotations:
        kargo.akuity.io/authorized-stage: 'team-ada:{{.path.basename}}'
    spec:
      project: team-ada
      sources:
      # valuesObject is an object-typed field (backed by RawExtension) --
      # Argo CD's Go-template engine only substitutes into string fields, so
      # `valuesObject: '{{.values}}'` can't work (same restriction the docs
      # call out for syncPolicy). The structure has to be spelled out here,
      # templating only the individual leaf values that genuinely vary by
      # stage (all quoted strings -- the one documented-safe pattern).
      # externalSecret.enabled and ingress.enabled are identical at every
      # stage in this design, so they're plain YAML booleans, not templated.
      # Templating them would mean either leaving the raw, un-rendered
      # `{{...}}` sitting in this YAML position -- which is ambiguous with
      # YAML flow-mapping syntax and so wouldn't even parse predictably --
      # or quoting it as a string, which risks Helm/Sprig's `if` treating a
      # quoted "false" as truthy. Hardcoding the booleans sidesteps both.
      - repoURL: ghcr.io/adamancini/charts
        chart: akkoma
        targetRevision: '{{.chartVersion}}'
        helm:
          valuesObject:
            akkoma:
              domain: '{{.values.akkoma.domain}}'
              adminEmail: '{{.values.akkoma.adminEmail}}'
            externalSecret:
              enabled: true
              name: '{{.values.externalSecret.name}}'
            postgresql:
              existingSecret: '{{.values.postgresql.existingSecret}}'
              storageSize: 2Gi
            storage:
              uploads:
                size: 5Gi
              frontends:
                size: 1Gi
            ingress:
              enabled: false
            image:
              tag: '{{.values.image.tag}}'
      - repoURL: https://github.com/akuity/sedemo-platform
        targetRevision: HEAD
        path: '{{.path.path}}'
        directory:
          include: 'externalsecret-*.yaml'
      destination:
        name: sedemo-primary
        namespace: 'team-ada-{{.path.basename}}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
        - CreateNamespace=true
