# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/argoproj.io/applicationset_v1alpha1.json
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: team-ada
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
  - git:
      repoURL: https://github.com/akuity/sedemo-platform
      revision: HEAD
      files:
      - path: "apps/team-ada/env/*/release.yaml"
  template:
    metadata:
      name: 'team-ada-{{.path.basename}}'
      annotations:
        kargo.akuity.io/authorized-stage: 'team-ada:{{.path.basename}}'
    spec:
      project: team-ada
      sources:
      - repoURL: ghcr.io/adamancini/charts
        chart: akkoma
        targetRevision: '{{.chartVersion}}'
        helm:
          # Values live in git (env/values.yaml + env/<stage>/values.yaml),
          # not inline here, so Kargo can render the exact same thing for
          # the staging diff. See env/values.yaml.
          valueFiles:
          - $values/apps/team-ada/env/values.yaml
          - $values/{{.path.path}}/values.yaml
      - repoURL: https://github.com/akuity/sedemo-platform
        targetRevision: HEAD
        path: '{{.path.path}}'
        directory:
          include: 'externalsecret-*.yaml'
      # Values-only source for the chart's valueFiles above.
      - repoURL: https://github.com/akuity/sedemo-platform
        targetRevision: HEAD
        ref: values
      destination:
        name: sedemo-primary
        namespace: 'team-ada-{{.path.basename}}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
        - CreateNamespace=true
