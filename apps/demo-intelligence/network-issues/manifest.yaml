apiVersion: apps/v1
kind: Deployment
metadata:
  name: mismatch-selector
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mismatch-selector
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mismatch-selector
    spec:
      containers:
        - name: guestbook
          image: ghcr.io/akuity/guestbook:v0.0.2
          command:
          - /app/guestbook
          args:
          - --port=3000
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 3000
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: 3000
          resources:
            limits:
              cpu: 100m
              memory: 64Mi
            requests:
              cpu: 10m
              memory: 32Mi
          securityContext:
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
---
apiVersion: v1
kind: Service
metadata:
  name: mismatch-selector
spec:
  type: ClusterIP
  # DEMO BUG (intentional): the pods are labeled
  # app.kubernetes.io/name=mismatch-selector, but this selector asks for
  # "mismatch-selector" (missing the trailing "s"). The Service is created
  # fine and Argo CD reports it Healthy, but it has zero endpoints, so all
  # traffic to it fails. Fix: make the selector match the pod label.
  selector:
    app.kubernetes.io/name: wrong-mismatch-selector
  ports:
    - name: http
      port: 80
      targetPort: http
