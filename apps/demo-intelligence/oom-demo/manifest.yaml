apiVersion: apps/v1
kind: Deployment
metadata:
  name: oom-demo
spec:
  minReadySeconds: 5
  # Argo CD only reports Degraded once the progress deadline is exceeded.
  # Keep this short enough for a demo but long enough to be unambiguous.
  progressDeadlineSeconds: 30
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: oom
      app.kubernetes.io/name: oom-demo
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: oom
        app.kubernetes.io/name: oom-demo
    spec:
      containers:
        - args:
            - '--vm'
            - '1'
            - '--vm-bytes'
            - 150M
            - '--vm-hang'
            - '1'
          command:
            - stress
          image: polinux/stress
          imagePullPolicy: Always
          name: oom
          # Without a readiness probe, every restart briefly marks the pod Ready,
          # which Kubernetes counts as rollout progress and resets the deadline,
          # making the app flap Degraded <-> Progressing. The initial delay is
          # longer than it takes stress to get OOMKilled, so a broken pod never
          # becomes Ready; once memory is raised it passes and the app goes Healthy.
          readinessProbe:
            exec:
              command: ["true"]
            initialDelaySeconds: 15
            periodSeconds: 5
          resources:
            limits:
              cpu: 50m
              memory: 128Mi
            requests:
              cpu: 50m
              memory: 128Mi
          securityContext:
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
