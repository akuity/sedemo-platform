apiVersion: apps/v1
kind: Deployment
metadata:
  name: oom-demo
spec:
  minReadySeconds: 5
  progressDeadlineSeconds: 30
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: oom
      app.kubernetes.io/name: oom-demo
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: oom
        app.kubernetes.io/name: oom-demo
    spec:
      containers:
        - args:
            - '--vm'
            - '1'
            - '--vm-bytes'
            - 150M
            - '--vm-hang'
            - '1'
          command:
            - stress
          image: polinux/stress
          imagePullPolicy: Always
          name: oom
          readinessProbe:
            exec:
              command: ["true"]
            initialDelaySeconds: 15
            periodSeconds: 5
          resources:
            limits:
              cpu: 50m
              memory: 178Mi
            requests:
              cpu: 50m
              memory: 178Mi
          securityContext:
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
