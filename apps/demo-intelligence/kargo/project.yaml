apiVersion: kargo.akuity.io/v1alpha1
kind: Project
metadata:
  name: demo-intelligence
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
---
apiVersion: kargo.akuity.io/v1alpha1
kind: ProjectConfig
metadata:
  name: demo-intelligence
  namespace: demo-intelligence
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  promotionPolicies:
  # Auto-promotion is off so a new guestbook image can't re-sync prod-crashloop
  # and undo the AI-SRE agent's live fix mid-demo. Break the demo on purpose by
  # syncing the Argo CD app or promoting freight to this stage.
  - stageSelector:
      name: prod-crashloop
    autoPromotionEnabled: false
