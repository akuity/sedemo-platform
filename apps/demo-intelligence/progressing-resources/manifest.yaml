apiVersion: apps/v1
kind: Deployment
metadata:
  name: progressing-resources
spec:
  minReadySeconds: 5
  # Long enough to be unambiguous in a demo; the broken probes below mean the
  # pod never becomes Ready, so the app stays Degraded once this passes.
  progressDeadlineSeconds: 30
  # Recreate replaces the pod on every change instead of leaving the previous
  # (fixed or broken) ReplicaSet running next to a rollout that never finishes.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: progressing-resources
  template:
    metadata:
      labels:
        app.kubernetes.io/name: progressing-resources
    spec:
      containers:
        - name: guestbook
          image: ghcr.io/akuity/guestbook:v0.0.2
          command:
          - /app/guestbook
          args:
          - --port=3000
          imagePullPolicy: Always
          # DEMO BUG (intentional): the app listens on 3000 (see --port above),
          # but both probes check 30000. The liveness probe kills the container
          # every ~10s (CrashLoopBackOff) and readiness never passes. The fix the
          # AI-SRE agent should propose is to point both probes at port 3000.
          livenessProbe:
            failureThreshold: 2
            httpGet:
              path: /
              port: 30000
              scheme: HTTP
            periodSeconds: 5
            successThreshold: 1
            timeoutSeconds: 1
          readinessProbe:
            httpGet:
              path: /
              port: 30000
          resources:
            limits:
              cpu: 100m
              memory: 32000Mi
            requests:
              cpu: 10m
              memory: 32000Mi
          securityContext:
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
