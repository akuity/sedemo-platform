apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: functional-tests
  namespace: team-eddie
spec:  
  args:
  - name: test-image
    value: alpine:latest
  metrics:
    - name: functional-tests
      provider:
        job:
          spec:
            backoffLimit: 1
            template:
              spec:
                containers:
                  - command:
                      - /bin/sh
                      - -c
                    args:
                      - 'for i in $(seq 1 5); do echo "Verification Step $i of 5"; sleep 2; echo -e "\tPASS"; done'
                    image: {{ args.test-image }}
                    name: test
                restartPolicy: Never