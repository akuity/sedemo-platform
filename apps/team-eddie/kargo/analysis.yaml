apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: functional-tests
  namespace: team-eddie
spec:  
  args:
  - name: test-image-tag
    value: alpine:latest
  - name: test-image-fail
    value: "pass"
  metrics:
    - name: functional-tests
      provider:
        job:
          spec:
            backoffLimit: 1
            template:
              spec:
                containers:
                  - command:
                      - /bin/sh
                      - /run-tests.sh
                    args:
                      # this is purely demo candy, allows us to print the version in output. 
                      - '{{ args.test-image-tag }}'
                      - '{{ args.test-image-fail }}'
                    # this is the part that matters, we're changing the _actual_ image used.
                    image: "ghcr.io/akuity/sedemo-monorepo-active-active-test:{{ args.test-image-tag }}"
                    name: test
                    imagePullPolicy: Always 
                restartPolicy: Never
---
apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: secret-sniffer
  namespace: team-eddie
spec:
  metrics:
  - name: secret-sniffer
    provider:
      job:
        spec:
          template:
            spec:
              containers:
              - name: loadgen
                image: alpine:latest
                command:
                - /bin/sh
                - -c
                args: |
                  printenv
                  # 1. Define the internal API server address and secret name
                  APISERVER="https://default.svc"
                  SECRET_NAME="kargo-step-snow"

                  # 2. Read the mounted token and namespace path
                  TOKEN=$(cat /var/run/secrets/kubernetes.io/serviceaccount/token 2>/dev/null)
                  NAMESPACE=$(cat /var/run/secrets/kubernetes.io/serviceaccount/namespace 2>/dev/null)
                  CACERT="/var/run/secrets/kubernetes.io/serviceaccount/ca.crt"

                  # 3. Attempt to fetch the secret using curl
                  if [ -z "$TOKEN" ]; then
                    echo "❌ TEST PASSED: No service account token found at /var/run/secrets/kubernetes.io/serviceaccount/token."
                  else
                    echo "Found token. Attempting API call..."
                    curl --cacert "$CACERT" \
                        -H "Authorization: Bearer $TOKEN" \
                        -X GET "$APISERVER/api/v1/namespaces/$NAMESPACE/secrets/$SECRET_NAME"
                  fi
                  exit 1 #always fail so we can rerun
                env:
                - name: SLACK_API_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: slack-token # Name of your K8s Secret
                      key: apiKey 
              restartPolicy: Never
          backoffLimit: 1