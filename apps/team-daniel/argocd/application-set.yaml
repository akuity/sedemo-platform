apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: team-daniel
  namespace: argocd
spec:
  ignoreApplicationDifferences:
  - jsonPointers:
    - /spec/source/targetRevision
  generators:
  - list:
      elements:
      - stage: dev
      - stage: staging-security
      - stage: staging
      - stage: prod-canary
  template:
    metadata:
      name: team-daniel-{{stage}}
      annotations:
        kargo.akuity.io/authorized-stage: team-daniel:{{stage}}
    spec:
      project: team-daniel
      source:
        repoURL: https://github.com/akuity/sedemo-platform
        targetRevision: main
        path: apps/team-daniel/charts/guestbook
        helm:
          valueFiles:
          - /apps/team-daniel/env/{{stage}}/image.yaml
          - /apps/team-daniel/env/{{stage}}/config.yaml
          - /apps/team-daniel/env/{{stage}}/feature-flags.yaml
      destination:
        name: sedemo-primary
        namespace: team-daniel-{{stage}}
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
        - CreateNamespace=true
---
# Mock QE suite runner backing the `staging` QE gate. Not promoted by Kargo — it is
# fixed demo infrastructure, so it syncs straight from main.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: team-daniel-qe-mock
  namespace: argocd
spec:
  project: team-daniel
  source:
    repoURL: https://github.com/akuity/sedemo-platform
    targetRevision: main
    path: apps/team-daniel/qe-mock
  destination:
    name: sedemo-primary
    namespace: team-daniel-qe
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
