# Connector tokens for the twingate-connector Application. The chart reads them
# via connector.existingSecret as TWINGATE_ACCESS_TOKEN / TWINGATE_REFRESH_TOKEN.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: twingate-connector-tokens
  namespace: twingate
  annotations:
    # Create (and wait for healthy) before the connector Deployment that reads it
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  # our actual secret store is in EKS cluster default NS
  secretStoreRef:
    name: aws-secretsmanager
    kind: ClusterSecretStore
  target:
    name: twingate-connector-tokens
  data:
  - secretKey: TWINGATE_ACCESS_TOKEN
    remoteRef:
      key: sedemo/twingate
      property: access-token
  - secretKey: TWINGATE_REFRESH_TOKEN
    remoteRef:
      key: sedemo/twingate
      property: refresh-token
