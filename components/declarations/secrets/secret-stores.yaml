apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: eso-secret-store-kargo
  namespace: argocd
spec:
  project: kargo
  source:
    repoURL: https://github.com/akuity/sedemo-platform
    path: secrets
    targetRevision: main
    directory:
      # Owned by the twingate-connector app so it can be ordered before the
      # connector Deployment (components/declarations/twingate).
      exclude: twingate-connector-tokens.yaml
  destination:
        name: sedemo-primary
  syncPolicy:
    syncOptions:
    - CreateNamespace=true
