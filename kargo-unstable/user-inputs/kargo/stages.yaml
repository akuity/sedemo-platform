# yaml-language-server: $schema=https://raw.githubusercontent.com/akuity/kargo/d30e01406b32d4ab5fa9445f5710b5011649d9ae/ui/src/gen/schema/stages.kargo.akuity.io_v1alpha1.json
apiVersion: kargo.akuity.io/v1alpha1
kind: Stage
metadata:
  name: prod
  namespace: user-inputs
  annotations:
    kargo.akuity.io/color: blue
spec:
  requestedFreight:
  - origin:
      kind: Warehouse
      name: some-warehouse
    sources:
      stages:
      - dev
  promotionTemplate:
    spec:
      steps:
      - uses: compose-output
        as: diff-link
        config:
          links:
            - icon: faGithub
              label: Link to Diff in VCS
              tooltip: Can use variables like name of freight, ${{ ctx.targetFreight.alias }}
              url: https://github.com/akuity/sedemo-platform/commit/d7a90f2b6970e9650c7837b4d353b07f6ec85839
      - task:
          name: require-release-note
      - uses: wait-for-approval
        as: approve
        config: {}            
      - uses: record-audit-event
        as: audit
        retry:
          errorThreshold: 3
        config:
          type: approved
          message: "Release to ${{ ctx.stage }} approved by ${{ outputs.approve.responses[0].user }}."
          actor: ${{ outputs.approve.responses[0].user }}
---
apiVersion: kargo.akuity.io/v1alpha1
kind: Stage
metadata:
  name: dev
  namespace: user-inputs
  annotations:
    kargo.akuity.io/color: blue
spec:
  requestedFreight:
  - origin:
      kind: Warehouse
      name: some-warehouse
    sources:
      direct: true
  promotionTemplate:
    spec:
      steps:
      - task:
          name: require-release-note
